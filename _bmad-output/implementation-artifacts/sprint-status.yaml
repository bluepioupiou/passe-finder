# TRANCHE ENCHAINEMENTS (2026-08-30)
# ---------------------------------------------------------------------------
# Alain a demande a demarrer l'Epic 4 par « la table + la recuperation de
# l'historique », dans la meme logique de tranche reelle que la tranche
# « positions ». Livre : collection Enchainement, migration des 119
# enchainements historiques (1322 maillons), blocage de suppression d'une passe
# utilisee. Voir 4-3-6-3-tranche-enchainements-collection-et-migration.md.
#
# DECOUVERTE METIER — LES TRANSITIONS.
# L'ancienne appli acceptait, au milieu d'une chaine, un maillon qui n'est pas
# une passe mais une POSITION seule (82 cas). Ce n'etait pas une erreur de
# saisie : c'est une TRANSITION de main (depuis « mains decroisees », lacher une
# main pour arriver en « main droite / main gauche »), sans passe. Consequence :
# 59 enchainements sur 119 sont DISCONTINUS au sens du graphe v2.
#
# Decisions d'Alain (2026-08-30) :
#   - tout migrer, ne rien inventer ; la vue lecture (4-4) affichera la reprise
#     (« on arrivait en X — reprise en Y ») ;
#   - les marqueurs ne deviennent pas des maillons : ils sont deductibles du
#     graphe (marqueur = position de depart de la passe suivante) et archives
#     dans `legacyMarqueurs` ;
#   - visibilite fidele au legacy : 107 partages, 12 prives.
#
# INSTRUIT le 2026-09-01 — Story 4.7, ecrite dans epics.md, FR-44 a FR-46.
#   Les trois volets prevus sont livres : objet Transition, reprise nommee en
#   lecture, changement de prise composable.
#   Ce qui a tranche, ce sont les DONNEES et pas l'intuition. Trois modeles
#   etaient en balance (libre / arete entre positions / arete portee par la
#   passe) ; le depouillement des 120 enchainements donne 103 reprises sur 18
#   trajets seulement, et 19 passes differentes arrivant en « main gauche /
#   main droite » rupturent toutes vers le meme petit groupe de cibles, sans
#   exception. Le determinant est la POSITION d'arrivee, jamais la passe.
#   Et l'ancienne appli avait deja l'objet : table `alternative`, dix lignes de
#   2009 avec leur texte de prof, jamais migree jusqu'ici. Elle expliquait plus
#   de quatre reprises sur cinq ; ce qui lui manquait, ce sont surtout les
#   RECIPROQUES (`A -> B` declaree, `B -> A` non).
#   Suite a la main d'Alain : `npm run rapport:transitions` liste les trajets
#   encore sans explication, tries par frequence, avec des exemples.
#
# Effets sur le suivi :
#   - 6-1 et 6-2 passent en `review` : tous les volets sont livres (30 positions,
#     110 passes rock sur 110 attendues).
#   - 6-3 passe en `review`.
#   - 4-3 passe en `in-progress` : le volet COLLECTION est livre, l'enregistrement
#     depuis le compositeur attend 4-1/4-2.
#   - 4-5 passe en `in-progress` : son dernier AC (blocage de suppression d'une
#     passe utilisee, FR-8/ADD-8) est livre en avance, le reste est a faire.
#
# DEPLOIEMENT — FIN DE L'IMPORT AUTOMATIQUE (decision Alain, 2026-08-30).
# L'entrypoint importait positions et passes au demarrage, sous condition « la
# base est-elle vide ? » (deploy/catalogue-vide.mjs). Ce garde-fou tout-ou-rien
# etait deja en defaut : la prod ayant des positions, il repond « peuple » et
# aurait saute l'import des enchainements pour toujours.
# Alternative etudiee puis ecartee : porter les imports dans src/migrations pour
# que `payload_migrations` en tienne le registre. Ecartee car la reprise du
# catalogue est un geste d'INITIALISATION, fait une fois par entite ; la base
# existe et est repliquee vers S3, l'automatisation n'apporte plus de securite.
# Consequences : entrypoint = schema + WAL + demarrage ; catalogue-vide.mjs
# supprime ; scripts migrate/* conserves dans l'image, lances a la main
# (`docker compose exec app npm run migrate:<entite>`), procedure ecrite dans
# docs/mise-en-production.md (etape 10).
# FAIT (2026-08-30, Alain) : `migrate:enchainements` a ete lance en prod. Les
# 119 enchainements y sont ; la reprise du catalogue legacy est donc complete
# en production (danses, positions, passes, enchainements).
