action_items:
  # Releve par Alain le 2026-08-30, en regardant le catalogue livre (5.4).
  - id: cartes-catalogue-harmoniser
    status: done
    titre: "Harmoniser les cartes Position et Passe dans le catalogue"
    concerne: [5-4-catalogue-navigable-positions-passes]
    constat: >
      Les deux cartes ont un ordre INVERSE. Position : image, puis nom, puis
      description. Passe : nom + difficulte, puis les deux images de la chaine,
      puis description. Le catalogue se filtre par nom : quand la grille se
      reduit, l'oeil cherche le nom, qui doit donc etre au meme endroit sur les
      deux types de carte.
    demande:
      - "Nom en premier sur les deux cartes (la carte Passe le fait deja ; c'est
         la carte Position qui est l'exception a corriger)."
      - "Puis l'image. Une seule image centree convient pour la position, mais
         plus petite qu'aujourd'hui."
      - "Puis la description, coupee a 3 lignes maximum avec « … » si elle
         depasse. Des items de hauteur homogene font une grille qu'on balaie,
         au lieu d'une liste qu'on deroule. La description complete reste
         visible sur la fiche."
    nuances_a_instruire:
      - >
        NE PAS rendre les deux cartes identiques. Une passe porte deux images
        par nature (depart -> arrivee, l'arete du graphe) ; une position en
        porte une, parce qu'elle est un noeud. Cette difference encode le
        modele de donnees. L'objectif est « meme ordre, meme rythme, contenu
        different assume », pas « meme carte ».
      - >
        2 lignes plutot que 3 ? Sur mobile, 3 lignes de description pesent deja
        plus que l'image. A trancher sur ecran, pas sur le papier.
      - >
        Un plancher pour l'image de position : un danseur reconnait une position
        a son schema avant d'en lire le nom. Plus petite oui, trop petite et la
        carte perd ce qui la rend identifiable d'un coup d'oeil.
    taille_estimee: "petite — CSS et ordre du balisage, pas de changement de modele"
    resolution: >
      2026-08-30, commit 8a1a3128 (« mise a plat des cards »). Les deux cartes
      suivent desormais le meme rythme : nom, puis image, puis description. La
      nuance « 2 ou 3 lignes » a ete tranchee A L'ECRAN a 3 lignes, via un
      utilitaire partage `.texte-coupe` (-webkit-line-clamp) dans styles.css.
      La difference de fond est conservee comme demande : une passe porte ses
      deux images (l'arete du graphe), une position n'en porte qu'une (le noeud).

  # Releve par Alain le 2026-08-30, en lancant les tests pendant que le serveur
  # de dev tournait.
  - id: tests-separer-back-et-front
    status: done
    titre: "Separer les tests back et front pour les piloter independamment"
    concerne: [outillage]
    constat: >
      `npm run test:int` melange deux natures de tests : ceux qui parlent a
      Payload et a la base (api, enchainement) et ceux qui n'exercent que des
      fonctions pures (recherche, enchainements, analytique). Les premiers
      ouvrent une connexion SQLite et poussent le schema ; quand le serveur de
      dev tourne en meme temps, ils tombent par intermittence sur
      SQLITE_BUSY/`database is locked` — alors que les seconds n'ont besoin de
      rien et durent quelques millisecondes.
    demande:
      - "Deux commandes distinctes : les tests purs, lancables en boucle sans
         base ni serveur, et les tests d'integration, qui prennent la base."
      - "Rendre les tests d'integration robustes a la contention (base de test
         dediee, ou attente/reessai sur le verrou) plutot que dependants de
         l'etat de la machine."
    nuances_a_instruire:
      - >
        Ne pas transformer les tests d'integration en tests a doublures : leur
        valeur vient justement de ce qu'ils passent par le vrai Payload et le
        vrai schema (c'est ce qui a attrape le defaut prive et le blocage de
        suppression). C'est l'ISOLATION qu'il faut, pas le remplacement.
      - >
        La CI ne voit pas le probleme (rien d'autre n'y touche la base) : le
        gain est pour le confort de developpement local, pas pour la fiabilite
        du pipeline. A doser en consequence.
    taille_estimee: "petite a moyenne — configuration vitest, pas de code applicatif"
    avancement: >
      2026-08-30 : volet E2E traite (un seul worker Playwright, comptes de test
      distincts par fichier).
    resolution: >
      2026-08-31. LA CAUSE N ETAIT PAS CELLE QU ON CROYAIT. Le constat initial
      accusait le serveur de dev tournant en meme temps ; en realite la CI
      echouait AUSSI, systematiquement (3 sur 3), et le serveur de dev n y est
      pour rien. Reproduit en local sur une base vierge, sans serveur : vitest
      execute les fichiers dans des PROCESSUS PARALLELES, chaque fichier qui
      appelle getPayload pousse le schema dans le meme fichier SQLite, et deux
      poussees concurrentes se verrouillent (SQLITE_BUSY sur une requete
      d introspection de sqlite_master). DEUX fichiers suffisaient : le defaut
      preexistait a la story 3-4, dont le troisieme fichier de test l a
      simplement rendu systematique au lieu d intermittent.
      Second defaut, distinct et bien reel : vitest.setup.ts charge le .env du
      projet, donc les tests ecrivaient DANS LA BASE DE DEVELOPPEMENT. D ou la
      collision avec npm run dev, et des fixtures melangees aux vraies donnees
      (3 positions de test retrouvees dans le catalogue, supprimees).
      CORRECTIF : deux commandes et deux configurations.
        - `npm run test:unit` : 37 tests purs, tests/unit/, parallelisme complet,
          moins d une seconde, utilisable en --watch pendant qu on code ;
        - `npm run test:int` : 12 tests, tests/int/, `fileParallelism: false` et
          base dediee `.tmp/test.db` supprimee avant chaque run (globalSetup).
      La serialisation est le correctif du bug ; la base dediee sort les vraies
      donnees du chemin et supprime la cascade de fixtures oubliees.
      CI reordonnee : tsc -> lint -> test:unit -> test:int, le plus rapide
      echoue en premier.
      DEBAT TRANCHE : Alain proposait de remplacer les tests de base par des
      tests entierement a doublures a l etape qualite. Ecarte, et la nuance
      compte : les trois defauts reels attrapes par ce projet (visibilite privee
      par defaut, blocage de suppression, regles d acces admin) sont des defauts
      de CABLAGE, qu une doublure de Payload ne peut pas voir. Hors des
      fonctions pures — deja testees purement, et qui sont 37 des 49 tests — la
      logique de ce projet n existe presque pas en dehors du framework. C etait
      l ISOLATION qu il fallait, comme le disait le constat d origine.
    reste_a_faire: >
      Les tests e2e ecrivent toujours dans la base de developpement, et c est
      VOULU : ils exercent la vraie application, qui a besoin du catalogue migre.
      Chaque fichier e2e nettoie derriere lui (titres horodates, comptes
      dedies). A surveiller si un scenario futur oublie son menage.
  # Releve par Alain le 2026-08-31, en regardant une fiche passe.
  - id: deroule-passe-mise-en-forme
    status: open
    titre: "Mettre en forme le deroule d une passe"
    concerne: [2-6-fiche-passe-publique-navigation-vers-les-positions]
    constat: >
      Le deroule est aujourd hui un simple paragraphe. Il porte pourtant une
      STRUCTURE FORTE que le rendu aplatit : le texte est ecrit temps par temps
      (« 1,2 : … », « 3 et 4 : … », « 5 et 6 : … »), c est-a-dire sur les 6
      temps du rock. Constate sur les vraies donnees : 110 passes sur 110 ont
      un deroule, et 105 sur 110 sont multi-lignes. Ce n est donc pas un cas
      marginal, c est ce qu on lit sur chaque fiche.
      Ce qui existe deja et ne doit pas etre perdu : `white-space: pre-line`
      preserve bien les sauts de ligne d origine. Rien n est casse — il manque
      la mise en forme qui ferait VOIR les temps au lieu de les laisser couler
      dans un bloc de texte.
    demande:
      - "Donner au deroule une forme qui montre les temps, plutot qu un
         paragraphe continu. Forme exacte a trancher a l ecran."
    nuances_a_instruire:
      - >
        LES TEMPS SONT DU TEXTE LIBRE, PAS UN CHAMP. Les rendre visuellement
        distincts suppose soit de les ANALYSER a l affichage (fragile : les
        formes varient — « 1,2 : », « 3 et 4 : », « 5 et 6 : » — et 5 deroules
        n ont aucun saut de ligne), soit de changer le modele (une liste de
        temps sur la Passe, avec reprise des 110 deroules existants). Le
        premier est reversible et ne touche pas aux donnees ; le second est
        plus juste mais engage une migration. A trancher AVANT de coder.
      - >
        Le plus long deroule fait 1706 caracteres. Toute mise en forme doit
        tenir sur telephone sans devenir un mur : c est la que la fiche est
        lue, en cours ou juste apres.
      - >
        Ne pas transformer le deroule en tableau des 6 temps : une passe ne
        remplit pas toujours les 6, et certaines en debordent. La forme doit
        suivre le texte reel, pas une grille theorique.
    a_signaler: >
      Une passe porte « A décrire » en guise de deroule — donnee historique
      incomplete, pas un defaut d affichage. A corriger dans /admin.
    taille_estimee: "petite si mise en forme seule (CSS et balisage) ; moyenne si on structure le modele"

  # Demande d Alain le 2026-08-31. Formalise la note « HTML brut dans les
  # descriptions » laissee ouverte dans la TRANCHE LECTURE DES ENCHAINEMENTS.
  - id: musique-enchainement-champ
    status: done
    titre: "Champ « musique » libre sur l enchainement"
    concerne:
      - 4-3-enregistrer-un-enchainement-metadonnees-defaut-prive-sauvegarde-fiable
      - 6-3-migrer-les-enchainements-liaisons-ordonnees
    constat: >
      La musique n a pas de place dans le modele, alors qu elle appartient a
      l enchainement : on danse une choregraphie SUR un morceau. Faute de
      champ, l information a ete glissee dans la description, et l historique
      en porte la trace. Constate sur les vraies donnees : 5 enchainements sur
      120 embarquent un lien dans leur description, et 2 d entre eux
      contiennent du balisage HTML brut (<a>, </br>) qui s affiche en toutes
      lettres sur la fiche.
      Les 5 liens disent d eux-memes ce que le champ doit accepter :
        - 2 chemins relatifs « musiques/*.mp3 » — fichiers de l ANCIEN site ;
        - 2 URL absolues vers www.passe-finder.fr/*.mp3 — ancien domaine ;
        - 1 lien DEEZER (deezer.com/listen-4200101).
      Autrement dit le cas « fournisseur de streaming » existe DEJA dans le
      catalogue, il n a simplement jamais eu de champ ou se poser.
    demande:
      - "Ajouter un champ « musique » LIBRE sur l enchainement : on doit
         pouvoir y mettre une URL, ou un lien de reference vers un fournisseur
         (Spotify ou autre)."
      - "Reprendre les 5 descriptions historiques : sortir le lien vers le
         nouveau champ et nettoyer le HTML brut qui reste affiche."
    nuances_a_instruire:
      - >
        LIBRE veut dire libre, mais un champ libre qui sera RENDU COMME UN LIEN
        est une saisie utilisateur affichee : il faudra n ouvrir que http(s)
        (un « javascript: » ne doit jamais devenir un lien cliquable) et poser
        rel="noopener noreferrer" sur la sortie. Ce champ sera rempli par les
        eleves des la Story 4.5, pas seulement par Alain.
      - >
        4 des 5 liens sont probablement MORTS : les deux chemins relatifs
        pointent vers des fichiers de l ancien site, et les deux URL absolues
        vers l ancien domaine en http. Question a trancher AVANT la reprise :
        ces mp3 existent-ils encore quelque part ? Les heberger est une autre
        decision (stockage, droits) que celle d ajouter un champ.
      - >
        Ne pas confondre avec la VIDEO (Story 4.6, FR-16/FR-37), qui est un
        champ distinct et deja prevu : la video montre l execution, la musique
        est ce sur quoi on danse. Deux champs, deux usages — ne pas les fondre
        en un « media » generique.
      - >
        Un champ texte libre suffit-il, ou faut-il un libelle en plus de l URL
        (« Gene Vincent — Be-Bop-A-Lula ») ? Le nom du morceau se lit mieux
        qu une URL sur la fiche, et survit a un lien mort. A trancher a l ecran.
    taille_estimee: "petite — un champ, une migration de schema, la reprise de 5 fiches a la main"
    resolution: >
      2026-08-31. Champ `musique` pose comme un GROUPE de deux champs
      facultatifs — `titre` et `lien` — et non comme un champ libre unique
      (tranche avec Alain a l ecran). Le titre est ce qui SURVIT au lien mort,
      le lien evite de retaper le nom dans une appli de streaming ; la fiche
      rend le TITRE cliquable, jamais l URL brute.
      Reconnaissance du fournisseur par l HOTE, en pur (`src/musique.ts`) :
      Spotify, Deezer, YouTube, Apple Music, SoundCloud, Bandcamp, avec repli
      sur le nom d hote pour un hebergeur inconnu — un lien inconnu reste
      cliquable. Comparaison par suffixe de label et non `includes`, sans quoi
      `spotify.com.exemple.net` se ferait passer pour Spotify.
      AUCUN APPEL AU RENDU : la fiche que lisent les eleves ne charge aucun
      tiers (FR-39, UX-DR1).
      A L ECRITURE, en revanche, le TITRE est demande au fournisseur par oEmbed
      quand le lien est seul (ajoute le 2026-08-31 sur demande d Alain, apres
      avoir constate a l usage qu un lien seul n affichait que « Ecouter sur
      Spotify »). oEmbed resout une URL qu on a DEJA : ni cle, ni application
      enregistree, ni secret a porter jusqu au deploiement — teste en vrai,
      Spotify rend « Africa » pour le lien correspondant. Quatre points
      publics : Spotify, Deezer, YouTube, SoundCloud ; Apple Music et Bandcamp
      n en publient pas, leurs liens restent sans titre automatique, ce qui
      n est pas une regression.
      Pose en `beforeChange` SUR LA COLLECTION et non dans l action du
      compositeur : /admin, l API et le compositeur ecrivent tous les trois, et
      une regle ecrite trois fois derive. Il ne se declenche que si l ecriture
      porte un lien ET qu aucun titre n est connu — une saisie humaine n est
      JAMAIS recouverte. Toute panne du tiers (reseau, 404, charge illisible,
      lenteur au-dela de 3 s) se solde par « pas de titre » et l enregistrement
      continue : un enregistrement ne doit jamais echouer a cause d un tiers.
      L artiste est ignore meme quand le fournisseur le donne (Deezer, YouTube) :
      le titre suffit, et une regle unique vaut mieux qu un libelle qui
      changerait de forme selon l hebergeur.
      L autre sens — « chercher le morceau par son TITRE via l API Spotify » —
      reste ECARTE : il demande une application enregistree et deux secrets de
      plus, et une recherche par titre renvoie des candidats (originaux,
      remasters, reprises) ; accrocher le premier silencieusement collerait un
      mauvais enregistrement, ce qui compte pour une choregraphie (tempo,
      montage, duree). S il revient, ce sera comme un SELECTEUR de propositions
      remplissant les deux memes champs, donc sans rien jeter de ce lot.
      Une seule icone (note au trait, `IconeNote`) plutot qu un logo par
      fournisseur : les logos de marque sont des formes pleines aux couleurs
      imposees, etrangeres a un jeu d icones qui suit `currentColor` et les deux
      themes. Le fournisseur est nomme en toutes lettres a cote.
      Garde sur le lien a TROIS endroits independants : la validation du champ
      (collection), l action serveur, et l affichage (`presenterMusique`). Seuls
      http(s) passent — ce champ sera rempli par les eleves et rendu en `<a>`.
      Sortie en `rel="noopener noreferrer"`, verifiee en e2e.
      NUANCE « les mp3 existent-ils encore ? » : TRANCHEE PAR LA MESURE, pas par
      hypothese. `passe-finder.fr/Choregraphie_2011_ENSAM-Gene_Vincent.mp3`
      redirige vers le nouveau site et repond 404 — les deux fiches 2011 gardent
      donc un TITRE et aucun lien. Les deux chemins relatifs `musiques/*.mp3`
      (2012) n ont rien a pointer : titre seul aussi. Le lien Deezer, lui, est
      VIVANT : il redirige vers `deezer.com/track/4200101`, et l API publique de
      Deezer nomme le morceau — Elvis Presley, « All Shook Up ». Reheberger les
      montages reste une decision a part (stockage, droits).
      REPRISE DES 5 FICHES : A LA MAIN, dans /admin (decision d Alain,
      2026-08-31). Un script avait ete ecrit puis RETIRE : pour cinq
      occurrences faites une seule fois, il coutait plus a relire et a
      maintenir qu il ne faisait gagner. Les cinq fiches (ids 37, 71, 72, 99,
      100) ont ete reprises EN LOCAL par ce script avant son retrait — la base
      de developpement porte donc deja le resultat, la PRODUCTION non. Ce qu il
      reste a faire a la main sur chacune : sortir le lien de la description
      vers le champ musique, et effacer le HTML brut (`<a>`, `</br>`) des fiches
      99 et 100 avec la phrase qui le portait.
      DANS LA GRILLE, la carte d enchainement porte la note seule, a la suite de
      la date et du nombre de passes, dans l accent DEJA utilise par la fleche du
      trajet — la carte garde donc une seule couleur (DESIGN.md). Le morceau
      lui-meme ne s y ecrit pas : au balayage, ce qu on veut savoir c est
      « celui-ci en a une ». L intitule est porte, invisible, pour les lecteurs
      d ecran : ici l icone EST l information.
      Deux corrections venues de l ecran : la ligne de musique de la fiche etait
      en `flex`, ce qui renvoyait tout le titre a la ligne sous une note
      esseulee sur telephone (repassee en flux de texte, l icone se comportant
      comme un caractere) ; et la carte affichait d abord le morceau en toutes
      lettres, ce qui allongeait la ligne sans rien apprendre.

  # Demande d Alain le 2026-08-31. DEUX SUJETS distincts dans une meme demande :
  # l identifiant public, et le modele de visibilite. Ils se tiennent, mais ils
  # ne coutent pas du tout la meme chose.
  - id: identifiant-opaque-et-visibilites
    status: done
    titre: "Identifiant opaque et modele de visibilite elargi"
    concerne:
      - 4-4-vue-lecture-partage-par-url-controles-de-partage
      - 4-3-enregistrer-un-enchainement-metadonnees-defaut-prive-sauvegarde-fiable
    constat: >
      Aujourd hui l URL d un enchainement est /enchainements/<id>, ou id est
      l entier auto-incremente de la base : les 120 enchainements migres vont
      de 1 a 120. On passe donc de l un a l autre en changeant un chiffre.
      Le modele de visibilite, lui, est BINAIRE (FR-17 / ADD-6) : prive ou
      partage, ou partage veut dire « lisible sans connexion ».
    demande:
      - "Remplacer l identifiant qui se suit par un HASH, plus difficile a
         deviner."
      - "Elargir la visibilite a quatre cas : public, totalement prive, partage
         au sein d une ecole ou d un cours, et LIEN DE PARTAGE genere (modele
         YouTube)."
    nuances_a_instruire:
      - >
        LE HASH NE PROTEGE PAS LE PRIVE, ET LE PRIVE N EST PAS EXPOSE
        AUJOURD HUI. Un enchainement prive repond deja 404 a qui n en est pas
        l auteur, y compris par URL directe et par l API : ce sont les `access`
        de la collection qui le decident, et c est couvert par des tests
        (integration et e2e). Deviner un identifiant ne donne donc acces a
        rien. Ce que l identifiant qui se suit laisse fuir est plus modeste :
        le NOMBRE d enchainements et le rythme de creation.
        Le hash est en revanche le PREREQUIS du lien de partage : dans le
        modele YouTube, c est l URL elle-meme qui fait office de cle. Avec un
        identifiant sequentiel, ce lien serait devinable par simple comptage.
        A retenir dans cet ordre : on ne fait pas le hash pour reparer une
        fuite, on le fait pour rendre le lien de partage possible.
      - >
        C EST MAINTENANT LE MOMENT LE MOINS CHER. Les URL publiques
        /enchainements/<id> n existent que depuis le 2026-08-30 et le site n a
        pas encore de vrais utilisateurs : personne n a mis un lien en favori
        ni ne l a colle dans une conversation. Chaque semaine d usage rendra ce
        changement plus couteux, puisqu il faudra alors garder les anciennes URL
        vivantes.
      - >
        NE PAS CHANGER LA CLE PRIMAIRE. Sous Payload/Drizzle, l entier ancre
        toutes les relations (auteur, maillons de passes, et les favoris a
        venir). Le geste peu couteux et reversible est d AJOUTER un champ
        d identifiant public, indexe et unique, et de router dessus — la cle
        primaire reste ce qu elle est. Prevoir la reprise des 120 existants.
      - >
        LES QUATRE CAS DEMANDES NE SONT PAS UN SEUL AXE, et c est la vraie
        difficulte de conception. Il y en a deux :
          (1) QUI a le droit de lire — moi seul / mon cours ou mon ecole / tout
              le monde ;
          (2) COMMENT on arrive dessus — en naviguant et en cherchant (liste),
              ou uniquement parce qu on a le lien (non liste).
        Le « partage » actuel confond les deux : il rend lisible ET il fait
        apparaitre dans les listes et la recherche. Le lien de partage YouTube,
        c est exactement « lisible par qui a le lien, absent des listes ».
        Separer ces deux questions avant de dessiner l enum evitera de repeindre
        la regle a chaque nouveau cas.
      - >
        « ECOLE OU COURS » RESTE HORS V1 — TRANCHE PAR ALAIN LE 2026-08-31.
        La question avait ete soulevee parce que le PRD range la visibilite
        multi-ecoles hors perimetre v1 et la place en Vision (§8), et que le
        brief dit que le succes du v1 ne se mesure PAS a l adoption par d
        autres ecoles. Reponse d Alain : « pas pour maintenant, ce n est pas
        une priorisation hors v1, on reverra ca plus tard ». La decision du
        brief tient donc, elle n est pas rouverte.
        Pourquoi c est note ici plutot qu oublie : le jour ou on y reviendra,
        ce ne sera pas un champ de plus. Il faudra des entites Ecole et Cours,
        une appartenance (qui est dans quel cours, qui l y ajoute), et la regle
        se propagera a la recherche, aux listes, aux favoris et au profil.
        C est un epic a instruire, pas une tache.
        A RETENIR POUR LA SUITE : les trois autres cas (public, prive, lien de
        partage) sont a portee du modele actuel et ne dependent pas de celui-la.
        Ils peuvent donc avancer seuls — a condition que l enum de visibilite
        soit dessinee en laissant la place au cas « ecole », plutot qu en
        supposant qu il n existera jamais.
    taille_estimee: >
      Identifiant opaque + lien de partage : moyenne (un champ, une migration,
      le routage, la reprise de 120 fiches) — et c est la partie faisable.
      Ecole/cours : epic a instruire, HORS V1, reporte sciemment (2026-08-31).
    livre: >
      LIVRE le 2026-09-01. Les trois cas a portee du modele actuel sont en
      place ; « ecole / cours » reste hors v1, comme prevu, et l enum lui laisse
      sa place (une valeur de plus, pas un modele different).

      LE MODELE, en une phrase : DEUX AXES, portes a deux endroits differents,
      et c est ce qu il faut avoir en tete avant d y toucher.
        - « apparait-il dans les listes » vit dans `access.read` de la
          collection, qui refuse le non-repertorie comme le prive. C est ce qui
          protege la liste, la recherche ET `GET /api/enchainements` — aucune
          surface n a a se souvenir d exclure quoi que ce soit ;
        - « qui a le droit de lire » vit dans `peutLire` (src/visibilite.ts) et
          n est consulte que par les chemins qui presentent l IDENTIFIANT
          PUBLIC : la fiche, et « mes favoris ». L URL est la cle.
      Le doublon est delibere et ASYMETRIQUE : `access.read` est plus strict.
      Un oubli du cote de `peutLire` ne peut jamais elargir ce que les listes
      montrent — au pire une fiche legitime repond 404.

      TROIS DECISIONS PRISES AVEC ALAIN LE 2026-09-01, sur les nuances notees
      plus haut :
        - `partage` est RENOMME `public`, migration des 108 lignes comprise. Le
          mot disait deux choses a la fois ; avec un troisieme cas il fallait
          choisir. Les valeurs sont `prive` / `nonRepertorie` / `public`.
        - LES ANCIENNES URL NUMERIQUES NE REPONDENT PLUS (404). Une redirection
          aurait sauve les vieux liens mais laisse retrouver n importe quel non
          repertorie par denombrement — c est-a-dire vide la fonction de son
          sens.
        - UN NON REPERTORIE PEUT SE METTRE EN FAVORI. Ce qu on recoit, on peut
          le ranger. Consequence non evidente : un favori ne se pose plus que
          sur presentation du LIEN (`Favori.idPublic`, la relation devient
          derivee). Sans ce verrou, n importe quel compte connecte enumererait
          les numeros 1, 2, 3… pour se constituer un favori sur chaque non
          repertorie — et « mes favoris » les lui afficherait tous.

      DEVELOPPEMENT : une base de dev ne joue pas les migrations (mode push).
      `npm run reprendre:visibilites` fait la reprise des donnees ; le script
      est idempotent et peut disparaitre une fois la transition passee.

  # Demande d Alain le 2026-08-31 au soir, notee pour le lendemain. TROIS
  # sujets qui se tiennent (ils portent tous sur la LISTE des enchainements)
  # mais qui se livrent separement.
  - id: liste-enchainements-auteur-filtres-pagination
    status: done
    titre: "Auteur affiche, filtres musique/video/auteur, et pagination de la liste"
    concerne:
      - 5-4-catalogue-navigable-positions-passes
      - 4-4-vue-lecture-partage-par-url-controles-de-partage
      - 5-2-profil-a-deux-listes-mes-enchainements-mes-favoris
    constat: >
      L AUTEUR n est affiche nulle part, contrairement a UX-DR10. La raison
      etait bonne au moment ou elle a ete posee : la collection users n a que
      l email, et publier une adresse sur une page ouverte se paie en spam.
      Alain tranche : afficher LA PARTIE AVANT L ARROBASE, par defaut.
      La LISTE, elle, charge tous les enchainements d un coup. A 120 c est
      tenable ; ca ne le restera pas quand les eleves creeront les leurs.
    demande:
      - "Afficher l auteur sur la FICHE et sur la CARTE, sur une ligne SOUS la
         date, le nombre de passes et les icones musique/video."
      - "Par defaut, l auteur affiche est la partie de l email avant le @."
      - "Filtrer la liste des enchainements : ceux qui ont une MUSIQUE, ceux qui
         ont une VIDEO, et par AUTEUR."
      - "PAGINER la liste : ne pas telecharger 1000 elements dans une page."
    nuances_a_instruire:
      - >
        LA PARTIE AVANT L ARROBASE RESTE UNE DONNEE PERSONNELLE. « begey.alain »
        publie sur une page ouverte est moins expose que l adresse entiere, mais
        il reste devinable : la plupart des comptes sont chez gmail, et un
        prenom.nom se recompose en une ligne. C est acceptable comme DEFAUT
        transitoire ; le vrai remede est le PSEUDO, note pour une autre branche
        (voir `pseudo-et-page-auteur`). A retenir dans cet ordre : le defaut
        existe pour que l auteur soit visible tout de suite, pas pour durer.
        Prevoir aussi le cas d une adresse qui porte le nom complet
        (prenom.nom@) — c est precisement le cas d Alain.
      - >
        LES FILTRES DOIVENT ETRE DES CONTRAINTES DE REQUETE, pas un tri en
        memoire apres coup : filtrer cote client obligerait a charger toute la
        liste, ce qui annulerait la pagination que la meme demande reclame. Les
        deux sujets se tiennent, et l ordre compte — pagination d abord, ou au
        moins pensee en meme temps.
      - >
        « A une musique » n est pas une seule question : le champ a deux
        moities. Un enchainement avec un TITRE mais sans lien a-t-il « une
        musique » ? A trancher : le plus utile est probablement oui — c est la
        presence de l information qui compte, pas celle du lien.
      - >
        Le filtre par AUTEUR croise le modele de visibilite : la liste ne montre
        que ce que le lecteur a le droit de voir (partages + les siens). Un
        filtre « auteur = X » ne doit donc jamais reveler combien X en a ecrit
        au total. Les `access` s en chargent deja, mais un compteur affiche a
        cote du filtre, lui, fuirait.
      - >
        La pagination doit tenir dans l URL (?page=2) pour que la page reste
        partageable et que le retour navigateur fonctionne. Attention au champ
        de recherche deja present : filtre et pagination doivent se combiner
        sans se reinitialiser l un l autre.
    taille_estimee: >
      Auteur affiche : petite. Filtres : moyenne (requetes + interface).
      Pagination : moyenne, et c est elle qui structure les deux autres.
    resolution: >
      2026-09-01, en trois lots (un commit chacun).
      AUTEUR : la partie avant l arobase. Sur la CARTE, une ligne sous la date
      et les marqueurs ; sur la FICHE, sur la meme ligne que la date et le
      nombre de passes (elle ne porte pas les marqueurs musique/video — elle
      montre les liens eux-memes plus bas —, la ligne a donc la place). L email ne sort jamais de
      `auteurs.ts` — les pages recoivent un nom deja reduit, jamais l objet
      `User`, et un test e2e verifie que l adresse n apparait nulle part. La
      lecture des comptes contourne DELIBEREMENT les `access` (`users` n est
      lisible que par soi-meme), sans quoi l auteur ne s afficherait que pour
      lui-meme. Le pseudo, quand il viendra, se branchera la et nulle part
      ailleurs.
      PAGINATION : 24 par page, tout dans l URL, des LIENS et non des boutons
      (donc partageable, retour navigateur, et fonctionne sans JavaScript).
      NON SEPARABLE DE LA RECHERCHE : un filtre reste cote client n aurait
      filtre que la page affichee — pire que pas de filtre, il aurait repondu
      « rien trouve » alors que le resultat etait page 3. D ou une colonne
      `titreNormalise` derivee du titre a chaque ecriture : le LIKE de SQLite
      est ACCENTUE, et chercher en base sans elle aurait fait perdre en silence
      l insensibilite aux accents acquise en 5.4 (« chore » trouve
      « Chorégraphie »). La migration reprend les 120 existants — une migration
      de schema qui laisse les donnees derriere elle est une panne a retardement.
      FILTRES : musique, video, auteur. « A une musique » = l UN OU L AUTRE des
      deux champs, exactement comme l icone de la carte (tranche par Alain) :
      c est la presence de l INFORMATION qui compte, pas celle du lien — quatre
      des cinq musiques de l historique n ont qu un titre. Deux conditions et
      non une (`exists` ET `not_equals: ''`) : les NULL et les chaines vides
      existent tous deux en base, et un test d integration le verrouille.
      Le menu des auteurs est tire des enchainements VISIBLES et non de la table
      des comptes : lister les comptes publierait le nom de chaque inscrit, y
      compris de ceux qui n ont rien partage. Il n apparait qu a partir de deux
      auteurs.
      Corrige au passage : les cases a cocher etaient collees a DROITE sur
      telephone (`align-self: flex-end` herite de la mise en ligne, ou l axe
      transversal n est pas le meme). Defaut anterieur, devenu visible a trois
      cases.

  # Demande d Alain le 2026-08-31 au soir. EXPLICITEMENT notee POUR UNE AUTRE
  # BRANCHE : ce n est pas la suite immediate.
  - id: pseudo-et-page-auteur
    status: in-progress
    titre: "Pseudo, page publique d un auteur, et suivi"
    # LE PSEUDO EST LIVRE (2026-09-01, demande d Alain). Restent la PAGE d un
    # auteur et le SUIVI, qui gardent cet item ouvert.
    livre_pseudo: >
      Champ `pseudo` sur les comptes, page /compte atteignable par le menu de
      compte, et `src/auteurs.ts` qui arbitre : pseudo s il existe, sinon la
      partie avant l arobase — exactement la ou le commentaire du lot precedent
      annoncait que ca se brancherait. Aucune page d affichage n a change.
      Trois decisions prises au passage, sur les nuances notees plus bas :
        - LE VIDE RETOMBE SUR L EMAIL, il ne masque pas l auteur. 119
          enchainements migres ont deja un auteur : faire disparaitre la ligne
          jusqu a ce que chacun passe par son compte aurait fait regresser
          l affichage au lieu de l ameliorer.
        - L UNICITE EST IMPOSEE, sur une colonne derivee `pseudoNormalise`
          (sans casse ni accent, meme normalisation que la recherche), avec un
          index unique. C etait le moment ou jamais : la nuance disait
          elle-meme que c est indolore a dix comptes et penible ensuite.
          Consequence assumee : la disponibilite d un pseudo est constatable
          par qui essaie d en prendre un — inherent a l unicite, et il s agit
          justement du nom qui s affiche en public.
        - LE PSEUDO NE PEUT PAS CONTENIR D AROBASE. Tout le module existe pour
          ne pas publier d adresse ; on ne laisse pas quelqu un en publier une
          volontairement.
      Defaut corrige en chemin : React 19 REINITIALISE un formulaire des que son
      action serveur se termine, erreur comprise. Un champ non controle perdait
      donc la saisie refusee (NFR-4 / UX-DR16). Constate en end-to-end.
      A VERIFIER AILLEURS : `FormulaireCompte` (connexion / inscription) est non
      controle et son commentaire promet de garder l email saisi — il ne le
      tient probablement plus.
    concerne:
      - 5-2-profil-a-deux-listes-mes-enchainements-mes-favoris
      - 5-3-accueil-fil-des-nouveautes
    constat: >
      Le nom d auteur affiche vient de l email faute de mieux (voir
      `liste-enchainements-auteur-filtres-pagination`). Un pseudo choisi est le
      vrai remede : il rend l affichage volontaire au lieu de subi.
      Vient ensuite l idee d un lieu ou l on voit ce qu une personne a publie,
      et de pouvoir la SUIVRE.
    demande:
      - "Permettre a un utilisateur de definir son PSEUDO — ce qui sera affiche
         comme auteur."
      - "Une PAGE par utilisateur : des informations sur les enchainements
         PUBLICS qu il a crees."
      - "Peut-etre pouvoir le SUIVRE, et voir sur la page d accueil les derniers
         elements crees par les auteurs suivis."
    nuances_a_instruire:
      - >
        Le pseudo est un champ PUBLIC sur un compte : il lui faut ses propres
        acces (chacun modifie le sien), et une regle pour le vide — retomber sur
        la partie avant l arobase, ou refuser d afficher ? Se decide avec le
        defaut de l autre lot.
      - >
        Unicite : deux « alain » sur une page de liste ne se distinguent plus.
        Imposer l unicite est simple tant qu on est dix, et penible ensuite.
        A trancher avant d ouvrir l inscription en grand.
      - >
        LA PAGE D UN AUTEUR NE MONTRE QUE DU PUBLIC. Avec le modele actuel
        (prive / partage), « public » veut dire partage. Si le modele de
        visibilite s elargit (voir `identifiant-opaque-et-visibilites`), cette
        page devra suivre — un enchainement « partage par lien » n a rien a
        faire dans une liste publique.
      - >
        LE SUIVI EST UN NOUVEL OBJET (qui suit qui), donc une collection de plus,
        avec ses acces, et un fil d accueil qui devient une requete sur les
        auteurs suivis — a rapprocher de la Story 5-3, deja au backlog, qui
        prevoit un fil des nouveautes. Ne pas construire deux fils.
      - >
        Suivre quelqu un le lui apprend-il ? Une liste d abonnes visible est une
        fonction sociale, avec ce qu elle emporte (comparaison, pression). A
        decider AVANT de coder, pas apres.
    taille_estimee: >
      Pseudo : petite (un champ, un acces, un formulaire). Page auteur :
      moyenne. Suivi + fil : epic a instruire — collection, acces, requetes,
      et des questions de produit qui ne sont pas techniques.

  # Demande d Alain le 2026-09-01 au soir. DEUX morceaux qui ne s adressent pas
  # au meme lecteur, et qui n ont pas le meme cout : le MODELE (du texte) et la
  # LECTURE DES VIGNETTES (des dessins).
  - id: page-comment-ca-marche
    status: open
    titre: "Page « comment ca marche » : le modele, et la lecture des vignettes"
    concerne:
      - 2-5-fiche-position-publique-exploration-du-graphe
      - 5-3-accueil-fil-des-nouveautes
      - 5-4-catalogue-navigable-positions-passes
    constat: >
      Le site ne dit nulle part CE QU IL EST. Un visiteur qui arrive comprend
      qu il y a des positions, des passes et des enchainements, mais rien ne lui
      explique que les trois forment un modele — ni pourquoi ce modele donne un
      generateur d enchainements plutot qu un catalogue de plus.
      Meme chose pour les vignettes de position : la convention de dessin (vue
      du dessus, couleurs du danseur et de la danseuse, sens du regard, noir et
      gris des bras) n est ecrite NULLE PART. Elle vit dans une trentaine
      d images et dans la tete d Alain. Un eleve qui ouvre une fiche voit deux
      pastilles et des traits, et doit deviner.
    demande:
      - "Une page d EXPLICATION du fonctionnement : un enchainement est une
         suite de passes ; une passe est une position de depart, une position
         d arrivee et un deroule ; et si l on arrive a codifier tout cela, on
         obtient un generateur d enchainements facile a utiliser et a partager."
      - "Un MINI TUTO de lecture des vignettes : comment les petites images du
         danseur et de la danseuse sont pensees."
      - "Un SCHEMA qui presente le danseur et la danseuse SEPAREMENT, montre que
         c est vu du dessus, explique le noir et le gris des bras et le sens
         dans lequel ils regardent."
    nuances_a_instruire:
      - >
        DEUX PUBLICS, DEUX MOMENTS, et c est ce qui decide de l endroit. Le
        « pourquoi ce site » se lit UNE FOIS, en arrivant : une page se justifie.
        La lecture d une vignette, elle, se demande DEVANT la vignette, sur une
        fiche position, pas dans un menu « a propos » qu on ne rouvrira jamais.
        A trancher : page unique, legende depliable sur la fiche position, ou
        les deux avec un lien de l une vers l autre.
      - >
        ECRIRE LA CONVENTION, C EST LA FIXER. Elle n existe aujourd hui que dans
        les images. La rediger obligera a decider ce qui est vrai — et fera
        probablement apparaitre des vignettes qui ne suivent pas tout a fait la
        regle. Prevoir ce temps-la : ce n est pas de la redaction, c est de la
        mise au net.
      - >
        LE SCHEMA EST UN DESSIN A PRODUIRE, pas du texte a taper — et c est le
        vrai cout du lot. Question de forme : un SVG dessine a la main (net a
        toutes les tailles, lisible en theme sombre, leger) ou une image comme
        les positions ? Le reste du site sert des JPEG, mais une legende qui
        doit rester lisible dans les deux themes a interet a etre du SVG.
      - >
        « SI L ON CODIFIE, ON OBTIENT UN GENERATEUR » EST L ARGUMENT DU PRODUIT,
        et un paragraphe le raconte mal. Une mini-demonstration vivante — une
        position de depart, les deux ou trois passes qui en partent, la chaine
        qui se construit sous les yeux — le dirait en trois secondes. C est le
        compositeur en miniature, donc du travail reel : a arbitrer contre le
        texte seul, pas a supposer acquis.
      - >
        LA PAGE FIXERA AUSSI LE VOCABULAIRE (« position », « passe »,
        « enchainement », « transition »). Si elle nomme les choses autrement
        que l interface, c est l interface qui aura tort aux yeux du lecteur.
        Relire les libelles a cette occasion.
      - >
        OU ELLE SE RANGE dans la navigation : pied de page (discret, mais c est
        la qu on cherche « a propos »), barre principale (visible, mais elle
        porte deja trois entrees et la recherche), ou depuis l accueil. Attention
        a la Story 5-3, qui prevoit d occuper l accueil avec le fil des
        nouveautes : les deux se disputeront la meme place.
    taille_estimee: >
      Le texte : petite. Les schemas : moyenne, et c est la que passe le temps.
      La mini-demonstration animee, si elle est retenue : moyenne a elle seule.

  # Demande d Alain le 2026-09-02. Trois morceaux qui tiennent ensemble : deux
  # listes de PLUS sur la fiche passe, et une regle de TRONCAGE qui vaut pour
  # toutes les listes de fiche, anciennes comprises.
  - id: fiche-passe-voisines-et-troncage-des-listes
    status: open
    titre: "Fiche passe : ce qui mene ici, ce qui enchaine apres, et troncage des listes a ~5"
    concerne:
      - 5-6-fiche-passe-complete-enchainements-videos-reverse-lookup
      - 2-6-fiche-passe-publique-navigation-vers-les-positions
      - 2-5-fiche-position-publique-exploration-du-graphe
    constat: >
      La fiche PASSE est un cul-de-sac de lecture : elle montre la position de
      depart et celle d arrivee, et rien de ce qui se danse AVANT ou APRES. La
      fiche POSITION, elle, fait deja exactement cela avec ses deux listes
      (« qui partent d ici », « qui arrivent ici »). L eleve qui lit une passe
      se pose la meme question qu il se pose devant une position — « et
      ensuite ? » — et doit aujourd hui repasser par la fiche position pour
      l obtenir.
      Les enchainements qui utilisent la passe manquent aussi : c est FR-24,
      deja note en Story 5-6 (backlog), jamais fait — l emplacement est reserve
      en commentaire dans le composant depuis la 2-6.
      Et le probleme qui vient avec : ces listes ne sont pas courtes. Sur les
      positions les plus frequentees, « qui partent d ici » depasse largement ce
      qui se lit d un coup d oeil, et la fiche charge tout (limit 200) pour tout
      afficher. Ajouter deux listes de plus a la fiche passe sans regle de
      troncage empilerait quatre listes longues au-dessus du deroule.
    demande:
      - "Sur la fiche PASSE, lister les passes qui MENENT ICI (celles dont la
         position d arrivee est la position de depart de celle-ci) et celles qui
         ENCHAINENT APRES (celles qui partent de sa position d arrivee), comme
         le fait deja la fiche position."
      - "Sur la fiche PASSE, lister les ENCHAINEMENTS qui la contiennent
         (FR-24 / Story 5-6)."
      - "TRONQUER ces listes a un nombre limite — genre 5 — et offrir un lien
         « voir plus » depuis la fiche pour la suite."
    nuances_a_instruire:
      - >
        LES DEUX NOUVELLES LISTES SONT DEJA AILLEURS, ET C EST LE VRAI
        ARBITRAGE. « Ce qui enchaine apres cette passe » EST, mot pour mot, la
        liste « passes qui partent d ici » de sa position d arrivee — deja
        affichee, a un clic. On ne rajoute donc pas une information, on epargne
        un clic. Ca peut suffire a justifier le lot (la question « et
        ensuite ? » se pose DEVANT la passe, pas apres un detour), mais ca doit
        etre dit : le cout n est pas nul et le gain est un raccourci, pas une
        donnee neuve. A trancher explicitement avant de coder.
      - >
        LES TRANSITIONS FONT PARTIE DE LA REPONSE. Depuis la position d arrivee,
        on peut aussi changer de prise SANS passe (Story 4.7) — le compositeur
        le propose. Une fiche qui annonce « ce qui enchaine apres » en ne
        montrant que les passes donne une reponse incomplete, et l incomplet est
        pire que l absent : il se lit comme exhaustif. Deux issues acceptables —
        inclure les transitions dans la meme liste (comme le compositeur), ou
        nommer la liste assez etroitement (« Passes qui enchainent ») pour
        qu elle ne promette que ce qu elle tient. Pas d issue « on verra ».
      - >
        CHOISIR 5 PARMI 30, C EST CHOISIR. Le troncage n est pas un reglage
        d affichage, c est un classement : lesquelles montre-t-on ? Alphabetique
        (stable, mais arbitraire — la fiche mettrait toujours en avant les
        memes), par difficulte croissante (pedagogique : les plus accessibles
        d abord, ce qui correspond a l usage reel de la fiche), ou par
        popularite (nombre d enchainements qui l utilisent — le plus utile, le
        plus cher, et il faudra le calculer). A trancher ; l ordre alphabetique
        d aujourd hui est un choix par defaut, pas un choix.
      - >
        LE COMPTEUR DOIT RESTER LE TOTAL, PAS 5. Les titres affichent deja
        « Passes qui partent d ici (12) ». Si le nombre devient celui des
        elements montres, le « voir plus » ment sur ce qu il cache. Donc compter
        en base (`totalDocs`) et ne charger que 5 — jamais tout charger pour
        compter.
      - >
        « VOIR PLUS » DOIT MENER QUELQUE PART QUI EXISTE. Pour les passes, la
        destination est gratuite et coherente : la FICHE POSITION porte deja la
        liste complete — le lien y renvoie, et la fiche passe redevient un
        raccourci assume vers elle. Pour les ENCHAINEMENTS, rien n existe :
        /enchainements filtre par musique, video et auteur, pas par passe. Il
        faudra soit ajouter un filtre `?passe=<id>`, soit assumer une liste
        tronquee sans suite. Le lot n est pas symetrique : la moitie
        « enchainements » coute plus cher que la moitie « passes ».
      - >
        LE SITE A DEJA UN APERCU TRONQUE, ET IL VAUT 6. La page /recherche
        montre `APERCU = 6` resultats par groupe avant « voir tout ». Deux
        conventions voisines (5 ici, 6 la-bas) et deux libelles voisins
        (« voir plus », « voir tout ») pour le meme geste, c est du bruit
        gratuit. Aligner les deux, ou savoir dire pourquoi ils different.
      - >
        LA REGLE VAUT AUSSI POUR LA FICHE POSITION, qui est le vrai endroit ou
        les listes debordent. Ne tronquer que la fiche passe laisserait la
        version longue exactement la ou le probleme a ete constate. Attention
        alors a son « voir plus » : la fiche position EST la destination des
        autres — il lui en faudra une a elle (catalogue pre-filtre, ou depliage
        sur place).
      - >
        LA VISIBILITE DES ENCHAINEMENTS EST UNE REGLE DE COMPTAGE, pas seulement
        d affichage (ADD-6). Un total de 12 affiche a un lecteur qui n a le droit
        d en voir que 3 fuite l existence de 9 enchainements prives. Le compteur
        se calcule sur ce que les `access` laissent passer, comme le menu des
        auteurs de la liste.
      - >
        NE PAS NOYER LE DEROULE. C est le contenu de cours, la raison d etre de
        la fiche. Quatre listes empilees autour de lui le repousseraient hors de
        vue sur telephone. L ordre de la fiche est a reprendre EN MEME TEMPS que
        l ajout, pas apres.
      - >
        LE LOT RECOUPE LA STORY 5-6, deja au backlog (enchainements + videos,
        FR-24 / FR-38). Ne pas ouvrir un doublon : cette note l ETEND (les deux
        listes de passes voisines, et le troncage) et sa moitie enchainements
        DOIT s y fondre — y compris la liste des VIDEOS, qui heritera de la meme
        regle de troncage.
    taille_estimee: >
      Les deux listes de passes voisines : petite (meme requete que la fiche
      position, deja ecrite). Le troncage generalise avec compteur juste :
      moyenne — il touche les deux fiches. La moitie enchainements : moyenne,
      et c est la Story 5-6 qui la porte, avec le filtre `?passe=` en prime.
    avancement: >
      2026-09-02, branche `feat/fiche-passe-voisines`. LA MOITIE « PASSES » EST
      LIVREE, LE TRONCAGE EST MIS EN PAUSE (decision d Alain le meme jour : « pas
      encore clair pour moi, peut-etre en V2 »). La demande a ete reformulee par
      lui en trois listes, et c est celle-la qui a ete faite : passes qui menent
      a la position de DEBUT, passes qui partent de la position de FIN, et
      TRANSITIONS partant de la position de fin.
      La nuance « l incomplet se lit comme exhaustif » est donc refermee par la
      TROISIEME LISTE et non par un titre etroit : apres une passe, on voit les
      deux facons de continuer, celle qui coute une passe et celle qui ne coute
      rien. Les titres nomment quand meme leur position (« Elles partent de
      Berceau gauche »), parce que sur une fiche passe les listes parlent de
      DEUX positions dont aucune n est le sujet de la page.
      Un seul sens pour les transitions (sortant), comme sur les cartes du
      catalogue : « on aurait pu arriver ici sans passe » repond a une question
      qui ne se pose plus une fois arrive.
      LES LISTES SONT ENTIERES, faute de troncage : la pire fiche affiche 44 + 24
      passes et mesure 24 000 px de haut. C est le prix assume de la pause ; les
      trois listes sont placees APRES le deroule pour que le contenu de cours ne
      soit pas repousse hors de vue.
      DECISION A CONNAITRE : une passe qui part et revient a la meme position
      (24 des 110) figure dans ses PROPRES listes. Elle se danse reellement deux
      fois de suite — l ecarter cacherait une option vraie. Verrouille par un
      test, pour que ca reste un choix et pas un oubli.
      Code : `voisinesDePasse` (src/catalogue.ts) porte la regle et se teste ;
      les listes elles-memes sont sorties de la fiche position dans un composant
      partage `Voisinage` (+ voisinage.css), les deux fiches le rendent.
      4 tests d integration ajoutes (71 verts), 158 unitaires, 56 e2e, build OK.
    reste_a_faire: >
      Le TRONCAGE a un apercu (avec compteur juste, alignement sur les 6 de
      /recherche, et une destination « voir plus » qui existe) : en pause,
      peut-etre V2. La moitie ENCHAINEMENTS (+ videos, + filtre `?passe=`) reste
      entiere et appartient toujours a la Story 5-6, au backlog.

