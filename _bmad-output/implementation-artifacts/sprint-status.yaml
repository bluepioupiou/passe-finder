# STORIES 3-1 / 3-2 : INSCRIPTION, CONNEXION, ETAT CONNECTE (2026-08-31)
# ---------------------------------------------------------------------------
# Tranche demandee par Alain apres 3-4 : « un eleve cree son compte, se
# connecte, se deconnecte, et la nav le reflete ». Livre avec son PREREQUIS.
#
# LE PREREQUIS, qui etait le vrai danger. Avant d ouvrir l inscription, les
# droits par defaut de Payload — « tout compte connecte peut tout » — devaient
# tomber. Ils etaient sans consequence tant que personne ne pouvait se
# connecter ; le jour de l inscription publique, ils auraient laisse le premier
# inscrit :
#   - reecrire et supprimer les enchainements des autres eleves ;
#   - LIRE LES ENCHAINEMENTS PRIVES de tout le monde (`read` renvoyait `true`
#     des qu une session existait — defaut trouve en posant la regle) ;
#   - lire et modifier les autres COMPTES, donc la liste des emails de la
#     classe et le mot de passe d autrui.
# Poses : `auteurOuAdmin` sur Enchainement (update/delete), lecture = partages
# de tous PLUS les siens quelle que soit leur visibilite, et `soiMemeOuAdmin`
# sur users (read/update/delete). Tous renvoient une CONTRAINTE DE REQUETE et
# non un booleen : la regle porte sur la selection des documents, donc elle
# vaut aussi pour les operations par lot et pour REST/GraphQL.
#
# LIVRE :
#   - /inscription et /connexion (E8), un seul composant de formulaire pour les
#     deux ecrans ; erreurs en francais, message IDENTIQUE pour « compte
#     inconnu » et « mot de passe faux » (ne pas dire quelles adresses ont un
#     compte ici) ;
#   - session posee par action serveur ; un compte neuf est connecte dans la
#     foulee (FR-26) ;
#   - `?suite=` : on revient a ce qu on voulait faire. N accepte qu un chemin
#     INTERNE — sans ce filtre, la page de connexion devenait un tremplin vers
#     un site tiers, signe de notre domaine ;
#   - barre de navigation : menu de compte (email, creer, deconnexion) pour un
#     connecte, « Se connecter » pour un anonyme. Ferme le placeholder laisse
#     ouvert depuis la Story 1.6 ;
#   - le compositeur ne renvoie plus vers /admin mais vers /connexion (+ le lien
#     d inscription), en emportant `suite`.
#
# /ADMIN RESERVE AUX ADMINISTRATEURS (decision Alain, 2026-08-31).
# `access.admin` sur users. Possible SEULEMENT maintenant : jusqu a 3-2, /admin
# etait l unique porte de connexion du site. Consequence sur les tests : le
# helper e2e se connectait par /admin/login pour TOUS les scenarios ; il est
# scinde en `login` (page publique, comptes ordinaires) et `loginBackOffice`
# (administrateurs), et le scenario d administration seme un compte admin.
#
# NON FAIT : 3-3 (mot de passe oublie) attend un expediteur d email, seule
# story de l Epic 3 a en avoir besoin. 3-5 (porte d acces reutilisable) reste
# entiere ; `?suite=` en est une anticipation partielle, cote formulaire
# seulement — la REDIRECTION automatique d un anonyme vers la connexion n est
# pas posee, chaque page refuse encore a sa maniere.
#
# A INSTRUIRE, releve en testant : la page d accueil affiche « Bienvenue,
# <email> » (heritage du scaffold). Maintenant que de vrais comptes existent,
# publier l email en h1 n a plus de sens. A reprendre avec 5-3 (accueil, E1),
# qui doit de toute facon remplacer cette page.
# FAIT le 2026-09-02 avec 5-3 : le h1 est « Passe Finder » pour tout le monde,
# le compte connecte se lit dans la barre de navigation.
#
# 37 unitaires, 21 integration (9 ajoutes), 23 e2e (6 ajoutes), build de prod OK.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# STORY 3-5 : PORTE D ACCES AUX ACTIONS RESERVEES (2026-08-31)
# ---------------------------------------------------------------------------
# Derniere story faisable de l Epic 3 (3-3 attend un expediteur d email).
#
# LE CONTRAT est dans src/porte.ts, sous DEUX FORMES, et cette distinction est
# tout l interet du module :
#   - `exigerSession(retour)` pour une PAGE : redirige vers /connexion en
#     emportant le chemin d origine. La personne n a encore rien fait,
#     l emmener ne lui coute rien ;
#   - `sessionCourante()` pour une ACTION : RENVOIE la session sans rediriger.
#     Une action est appelee alors qu un travail est deja a l ecran (une chaine
#     composee) ; rediriger le jetterait. Elle decide donc elle-meme quoi
#     afficher, en gardant le travail (NFR-4, UX-DR16).
#
# DEMONTRE ET BRANCHE, comme l exige le dernier AC :
#   - /enchainements/nouveau passe par `exigerSession`. Il affichait jusqu ici
#     une page d invitation avec un bouton « Se connecter » : un clic de plus
#     pour le meme resultat. Il emmene desormais directement ;
#   - l action d enregistrement passe par `sessionCourante` ;
#   - la barre de navigation aussi — trois copies du meme `payload.auth` sont
#     devenues un seul appel.
# Favori (5-1) et profil (5-2) s y brancheront sans rien reecrire.
#
# LA PORTE NE SECURISE RIEN, et c est ecrit dans le module : elle soigne le
# PARCOURS. Les `access` de la collection decident en dernier ressort (ADD-5).
# Page, action et collection verifient, independamment.
#
# `retour` EST PASSE EXPLICITEMENT plutot que devine : Next ne donne pas l URL
# courante a un composant serveur de facon fiable, et une valeur devinee qui se
# trompe renverrait la personne ailleurs que la ou elle voulait aller — pire
# que de ne pas la renvoyer du tout.
#
# L ecran de connexion DIT POURQUOI il demande un compte quand on arrive par la
# porte. Sans cela, il se lit comme un refus plutot que comme une etape.
#
# RETIRE EN PASSANT (demande d Alain) : l entree « Créer un enchaînement » du
# menu de compte. Le « + » voisin est la seule porte de creation ; deux entrees
# pour le meme geste, a quelques dizaines de pixels l une de l autre, n ouvrent
# aucun chemin de plus.
#
# 37 unitaires, 21 integration, 25 e2e (2 ajoutes), build de prod OK.
#
# L EPIC 3 EST DESORMAIS COMPLETE SAUF 3-3, qui attend la decision SES /
# Resend — la seule story du projet a dependre d un envoi d email.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# GEL TEMPORAIRE DE LA CREATION D UN ENCHAINEMENT (2026-08-31)
# ---------------------------------------------------------------------------
# Demande d Alain : « tant que je n ai pas resolu certaines choses, seul
# l admin a le droit de voir le bouton + ».
#
# CE N EST PAS UN CHANGEMENT DE PRODUIT, C EST UN GEL. Composer est le geste
# central du produit et n a pas vocation a rester reserve a l admin. Le motif
# est le modele de visibilite, encore ouvert (action item
# `identifiant-opaque-et-visibilites`) : laisser les eleves composer avant de
# savoir ce que « partage » voudra dire leur ferait produire des enchainements
# dont la portee changerait sous leurs pieds.
#
# CACHER LE BOUTON N AURAIT PAS SUFFI. La demande portait sur le « + », mais
# l affichage ne ferme ni /enchainements/nouveau ni l API : un compte ordinaire
# connaissant l URL aurait continue de composer et d enregistrer. Le gel est
# donc pose aux TROIS niveaux, derriere un seul predicat :
#   - `peutCreerEnchainement` (src/collections/acces.ts) — le seul endroit a
#     changer pour rouvrir : remplacer le corps par `Boolean(req.user)` ;
#   - la collection Enchainement (`create`), qui protege reellement ;
#   - la page du compositeur, qui renvoie vers la liste ;
#   - la barre, ou le « + » disparait.
# Le predicat porte un nom a lui plutot que d etre `adminSeul` recopie : le jour
# de la reouverture, on ne veut pas avoir a deviner lesquels des `estAdmin` du
# projet parlaient de creation.
#
# TRACES A SUPPRIMER A LA REOUVERTURE (elles decrivent un etat provisoire, pas
# une regle du produit) :
#   - tests/int/proprietaire.int.spec.ts, « refuse la creation ... (gel
#     temporaire) » ;
#   - tests/e2e/compte.e2e.spec.ts, « un compte ordinaire ne voit pas le + » ;
#   - le drapeau `admin: true` du compte de tests/e2e/compositeur.e2e.spec.ts,
#     et celui de l administrateur seme dans compte.e2e.spec.ts ;
#   - dans compte.e2e.spec.ts, la porte d acces se reconnecte en administrateur
#     faute de quoi elle ne pourrait pas montrer que la destination demandee est
#     bien rejouee. A remettre sur le compte ordinaire.
#
# EFFET SUR 4-3 : la story reste `review`, son code est intact. Seul le droit
# d appeler la creation est restreint, et de facon reversible.
#
# 37 unitaires, 22 integration (1 ajoute), 25 e2e, build de prod OK.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# STORY 5-1 : FAVORIS (2026-08-31)
# ---------------------------------------------------------------------------
# Demande d Alain : mettre en favori depuis la fiche, retrouver ses favoris
# depuis le menu utilisateur, et filtrer la liste des enchainements sur ses
# favoris. Les deux premiers sont la story 5-1 et une moitie de 5-2 ; le
# troisieme est une extension de la grille de 5-4.
#
# LA CONTRAINTE ADD-9 EST TENUE TELLE QUELLE : on ne met en favori QUE le
# partage d autrui. Consequence a connaitre avant de tester a l ecran — ALAIN
# NE VERRA LE BOUTON NULLE PART sur les 120 enchainements migres, puisqu il en
# est l auteur. C est le comportement voulu (le sien se retrouve dans « mes
# enchainements », story 5-2), mais il faut un second compte ordinaire pour
# voir la fonction vivre. Si la regle doit sauter, c est une ligne dans
# `peutEtreMisEnFavori` ET une dans le hook de la collection — mais cela
# reviendrait a rouvrir AD-7.
#
# UN LIEN, JAMAIS UNE COPIE : si l auteur corrige son enchainement, le favori
# suit. La page /favoris relit d ailleurs les enchainements a travers leurs
# `access` plutot que par la relation en profondeur — un enchainement repasse
# en prive depuis la mise en favori disparait donc de la liste, au lieu d y
# rester en fantome.
#
# OU VIT LA REGLE. La collection `Favori` decide (prive refuse, le sien refuse,
# unicite du couple, proprietaire pris dans la SESSION et non dans la saisie).
# Le predicat pur `peutEtreMisEnFavori` ne fait qu'eviter de proposer un bouton
# qui serait refuse : doublon DELIBERE et assume, teste des deux cotes.
# L unicite passe par un hook faute d index composite dans Payload ; a l echelle
# d une classe de danse, la course entre deux clics est theorique et son pire
# effet serait un doublon sans consequence.
#
# BOUTON OPTIMISTE : l etoile bascule avant la reponse du serveur, et revient
# en arriere en affichant la raison si l action echoue. Mettre en signet est un
# geste anodin et repete ; une attente a chaque clic le rendrait penible.
# PIEGE QUE CELA A CREE, et qui a mordu : le premier jet des tests e2e etait
# rouge une fois sur quatre, parce qu il naviguait des le changement de libelle,
# donc parfois AVANT que l ecriture ait atterri. Corrige en attendant que le
# bouton soit reactive (il est desactive pendant la transition). A garder en
# tete pour toute future bascule optimiste.
#
# EXTRAIT EN PASSANT : `CarteEnchainement`. Deux pages la rendent desormais
# (la liste et les favoris) ; recopiee, elle aurait derive, et la grille aurait
# perdu le rythme commun qui la rend balayable.
#
# LE FILTRE « MES FAVORIS » n apparait que pour un compte connecte AYANT au
# moins un favori : une case qui ne peut rien donner est pire que pas de case.
#
# ECART ASSUME AVEC UN AC (decision Alain, 2026-08-31). L AC de 5-1 prevoyait
# qu'un visiteur anonyme se voie proposer de se connecter depuis la fiche, puis
# soit ramene dessus. Le bouton a ete RETIRE : il encombrait la lecture pour un
# geste que personne ne vient chercher en consultant. La porte n est pas perdue
# — la barre de navigation propose « Se connecter » sur toutes les pages, et le
# favori apparait des qu on l est. L AC reste dans epics.md : il est ecarte
# sciemment, pas oublie.
#
# NON FAIT : la liste « mes enchainements » du profil (5-2), qui reste annoncee
# comme a venir dans le menu. La page /favoris en est la premiere moitie.
#
# 42 unitaires (5 ajoutes), 29 integration (7 ajoutes), 31 e2e (6 ajoutes),
# migration 20260831_165326_favoris, build de prod OK.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CONVENTION DE STATUT — QUAND UNE STORY PASSE `done` (decision Alain, 2026-08-30)
# ---------------------------------------------------------------------------
# Constat : 22 stories sont en `review` et AUCUNE en `done`. Ce n'est pas un
# oubli de suivi.
#
# Decision : une story ne passe `done` qu'apres confrontation a de VRAIS
# UTILISATEURS — les eleves d'Alain — ce qui joue ici le role de la demo de fin
# de sprint. `review` signifie donc « livre, en production, mais pas encore
# valide par l'usage ». Tant que personne d'autre qu'Alain n'a utilise le site,
# rien ne bascule.
#
# Consequence a garder en tete : le taux de `done` ne mesure PAS l'avancement du
# code. Pour savoir ou en est le produit, lire `review` comme « fait ». La
# bascule en masse se fera en une fois, apres les premiers retours d'eleves.
# Rappel : c'est aussi le critere de succes v1 du brief — « Alain et ses propres
# eleves utilisent reellement l'appli ». La convention de statut colle donc a la
# definition de succes du produit, elle ne s'y ajoute pas.
# ---------------------------------------------------------------------------

