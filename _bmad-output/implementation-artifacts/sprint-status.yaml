# ---------------------------------------------------------------------------
# TRANCHE ENCHAINEMENTS (2026-08-30)
# ---------------------------------------------------------------------------
# Alain a demande a demarrer l'Epic 4 par « la table + la recuperation de
# l'historique », dans la meme logique de tranche reelle que la tranche
# « positions ». Livre : collection Enchainement, migration des 119
# enchainements historiques (1322 maillons), blocage de suppression d'une passe
# utilisee. Voir 4-3-6-3-tranche-enchainements-collection-et-migration.md.
#
# DECOUVERTE METIER — LES TRANSITIONS.
# L'ancienne appli acceptait, au milieu d'une chaine, un maillon qui n'est pas
# une passe mais une POSITION seule (82 cas). Ce n'etait pas une erreur de
# saisie : c'est une TRANSITION de main (depuis « mains decroisees », lacher une
# main pour arriver en « main droite / main gauche »), sans passe. Consequence :
# 59 enchainements sur 119 sont DISCONTINUS au sens du graphe v2.
#
# Decisions d'Alain (2026-08-30) :
#   - tout migrer, ne rien inventer ; la vue lecture (4-4) affichera la reprise
#     (« on arrivait en X — reprise en Y ») ;
#   - les marqueurs ne deviennent pas des maillons : ils sont deductibles du
#     graphe (marqueur = position de depart de la passe suivante) et archives
#     dans `legacyMarqueurs` ;
#   - visibilite fidele au legacy : 107 partages, 12 prives.
#
# A INSTRUIRE — story « Transitions » a ecrire dans epics.md :
#   1. objet Transition = arete position -> position sans passe ;
#   2. vue lecture : nommer la transition au lieu d'afficher une rupture ;
#   3. compositeur : faire glisser la position d'arrivee d'une passe vers une
#      position atteignable par transition, ce qui elargit les passes proposees
#      ensuite — sans polluer le catalogue de passes.
#   Les 82 marqueurs archives disent quelles transitions existent reellement.
#
# Effets sur le suivi :
#   - 6-1 et 6-2 passent en `review` : tous les volets sont livres (30 positions,
#     110 passes rock sur 110 attendues).
#   - 6-3 passe en `review`.
#   - 4-3 passe en `in-progress` : le volet COLLECTION est livre, l'enregistrement
#     depuis le compositeur attend 4-1/4-2.
#   - 4-5 passe en `in-progress` : son dernier AC (blocage de suppression d'une
#     passe utilisee, FR-8/ADD-8) est livre en avance, le reste est a faire.
#
# DEPLOIEMENT — FIN DE L'IMPORT AUTOMATIQUE (decision Alain, 2026-08-30).
# L'entrypoint importait positions et passes au demarrage, sous condition « la
# base est-elle vide ? » (deploy/catalogue-vide.mjs). Ce garde-fou tout-ou-rien
# etait deja en defaut : la prod ayant des positions, il repond « peuple » et
# aurait saute l'import des enchainements pour toujours.
# Alternative etudiee puis ecartee : porter les imports dans src/migrations pour
# que `payload_migrations` en tienne le registre. Ecartee car la reprise du
# catalogue est un geste d'INITIALISATION, fait une fois par entite ; la base
# existe et est repliquee vers S3, l'automatisation n'apporte plus de securite.
# Consequences : entrypoint = schema + WAL + demarrage ; catalogue-vide.mjs
# supprime ; scripts migrate/* conserves dans l'image, lances a la main
# (`docker compose exec app npm run migrate:<entite>`), procedure ecrite dans
# docs/mise-en-production.md (etape 10).
# FAIT (2026-08-30, Alain) : `migrate:enchainements` a ete lance en prod. Les
# 119 enchainements y sont ; la reprise du catalogue legacy est donc complete
# en production (danses, positions, passes, enchainements).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# TRANCHE LECTURE DES ENCHAINEMENTS (2026-08-30)
# ---------------------------------------------------------------------------
# Suite immediate de la tranche precedente : les 119 enchainements etaient en
# base mais invisibles hors /admin. Alain a demande « le menu pour y aller, la
# liste des cards avec recherche, la fiche ». Livre : entree de navigation,
# /enchainements (cartes filtrables par titre), /enchainements/<id> (entete,
# chaine deroulee, reprises nommees), et le groupe « Enchainements » qui
# manquait a la recherche globale.
# Voir 4-4-5-5-tranche-lecture-enchainements.md.
#
# La visibilite n'est filtree NULLE PART dans l'interface : les pages lisent
# avec `overrideAccess: false`, donc ce sont les `access` de la collection qui
# decident (ADD-5). Un anonyme voit les 107 partages ; les 12 prives repondent
# 404, y compris par URL directe.
#
# RESTE A FAIRE sur 4-4, et cela DEPEND DE L'EPIC 3 : basculer prive/partage,
# copier le lien, editer, supprimer, mettre en favori. Aucun de ces controles
# n'est pose en placeholder inerte dans la page — meme raison que pour la zone
# de compte de la barre de navigation.
#
# RENDU DE LA CHAINE — 2e passe, decidee avec Alain a l'ecran le 2026-08-30.
# Le premier rendu (grande chaine verticale, une vignette par position) a ete
# refuse : c'est la POSITION qu'on voyait, alors que ce qui est enchaine, ce
# sont les passes ; le desktop gachait sa largeur ; la reprise, en encart plein
# format, criait plus fort que l'evenement qu'elle decrit.
# Retenu : un SERPENTIN de cartes de largeur egale (une carte par passe), la
# position reduite a une bulle posee a cheval sur le bord entre deux cartes et
# dessinee une seule fois. La ligne 1 va a droite, on descend a l'extremite, la
# ligne 2 repart a gauche ; sur telephone il ne reste qu'un fil vertical.
# La reprise est un RECOUVREMENT (la position d'ou l'on repart ecrase celle sur
# laquelle on arrivait) avec une marque discrete et une info-bulle.
# Les typologies de cartes enumerees par Alain (gauche->droite, gauche->bas,
# haut->droite, droite->gauche, droite->bas, haut->gauche, haut->bas) sont
# devenues la fonction pure `typologie()` dans src/enchainements.ts, sous tests.
# La page d'experimentation qui a servi a trancher a ete supprimee.
#
# A INSTRUIRE (releve en regardant les vraies donnees a l'ecran) :
#   - quelques descriptions historiques contiennent du HTML brut
#     (<a href='musiques/...mp3'>) qui s'affiche en toutes lettres. A nettoyer
#     a la main, ou a reprendre comme un champ « musique » a part entiere ;
#   - l'auteur n'est pas affiche dans l'entete, contrairement a UX-DR10 : la
#     collection users n'a que l'email, qu'on ne publie pas. A rouvrir avec 3-1.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# TRANCHE CREATION D'UN ENCHAINEMENT (2026-08-30)
# ---------------------------------------------------------------------------
# Suite immediate de la tranche lecture. Demande d'Alain : « l'US sur la
# creation d'un enchainement. Uniquement les comptes connectes, pas de gestion
# des ruptures de position pour le moment. Un bouton "+" dans la barre de menu,
# juste avant la recherche, ouvre un menu "creer un enchainement" ; absent si on
# n'est pas connecte. Pas d'ecole ni de cours : date (aujourd'hui par defaut),
# description, etc. »
# Livre : moteur de composition, entree « + », page /enchainements/nouveau,
# action serveur d'enregistrement.
# Voir 4-1-4-2-4-3-tranche-creation-enchainement.md.
#
# LA PORTE EST COTE SERVEUR. L'absence du « + » n'est qu'un confort d'affichage :
# la page ET l'action verifient la session, independamment l'une de l'autre, et
# l'ecriture passe par les `access` de la collection (`overrideAccess: false`).
#
# AUCUNE RUPTURE N'EST COMPOSABLE, comme demande : le rail ne propose que les
# passes qui partent de la position courante. Les enchainements crees dans
# l'app sont donc continus par construction, ce qui laisse intact l'historique
# migre et ses 59 chaines discontinues (transitions de main, toujours a
# instruire).
#
# DECISIONS a valider a l'ecran avec Alain :
#   - la chaine EN CONSTRUCTION est verticale, la ou la vue lecture deroule un
#     serpentin. Pendant la composition, chaque ajout doit se poser au bout sans
#     deplacer ce qui precede ; un serpentin se recompose a chaque clic et fait
#     sauter ailleurs la carte qu'on vient de poser. Si le serpentin est prefere
#     ici aussi, il faudra faire accepter a `ChaineEnchainement` les vues
#     legeres (il exige aujourd'hui les types Payload complets) ;
#   - pas de toast « Enregistre » : on atterrit sur la fiche, la confirmation
#     c'est de voir son travail. Les controles de partage (copier le lien,
#     basculer prive/partage) relevent de 4-4 et attendent l'Epic 3 ;
#   - le champ VIDEO n'est pas propose par le compositeur (Story 4.6) : la
#     demande disait « la date, une description, etc. ». Un champ suffit a
#     l'ajouter, la fiche l'affiche deja.
#
# Le compositeur ne recoit pas le catalogue mais sa PROJECTION (~10 Ko au lieu
# de ~130 Ko) : il n'affiche ni description ni deroule. Consequence : la chaine
# du compositeur ne peut pas reutiliser `ChaineEnchainement` en l'etat.
#
# Effet de bord assume : la barre de navigation lit la session, donc TOUTE page
# devient dynamique. Chacune portait deja `force-dynamic`, et une barre mise en
# cache montrerait l'etat du premier visiteur venu.
#
# FILET E2E REPARE EN PASSANT (il etait rouge AVANT cette tranche) :
#   - `login.ts` et `admin.e2e.spec.ts` attendaient `.step-nav__first`, renomme
#     depuis par Payload : la connexion reussissait, l'assertion tombait ;
#   - `seedTestUser`/`cleanupTestUser` prennent des identifiants, pour que deux
#     fichiers ne se suppriment plus mutuellement leur compte ;
#   - Playwright tourne avec UN SEUL worker partout : deux fichiers ecrivant en
#     parallele dans SQLite, avec le serveur de dev qui tient la base, tombaient
#     sur « database is locked ». Recoupe l'action item
#     `tests-separer-back-et-front`, qui reste ouvert pour les tests
#     d'integration (vitest).
#   17 tests e2e verts, 42 tests d'integration verts, build de prod OK.
#
# RESTE A FAIRE sur l'Epic 4 : editer/supprimer (4-5), la video (4-6), et les
# controles d'auteur de 4-4 — tous dependants de l'Epic 3 pour la connexion
# publique. L'invitation a se connecter pointe aujourd'hui vers /admin.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# STORY 3-4 : ROLE ADMIN & GOUVERNANCE DU CATALOGUE (2026-08-30)
# ---------------------------------------------------------------------------
# Premiere story de l'Epic 3. Choisie en tete parce qu'elle est le prerequis de
# 3-1 : sans le drapeau, tout inscrit pourrait editer le catalogue.
#
# QUESTION POSEE PAR ALAIN AVANT DE LANCER : « pas un service AWS simple pour
# eviter de gerer creation de comptes, envoi de mail, mot de passe oublie ? »
# Reponse retenue, qui CONFIRME AD-9 apres examen (la decision a ete rouverte,
# pas subie) : la question melangeait deux choses.
#   - L'AUTHENTIFICATION est deja acquise et gratuite : `auth: true` sur la
#     collection users fournit comptes, sessions, hachage, et les operations
#     forgot-password / reset-password. Il ne reste qu a poser des ecrans.
#   - L'ACHEMINEMENT DU MAIL est le seul vrai trou : Payload fabrique le
#     message mais ne le livre pas (au demarrage : « No email adapter
#     provided. Email will be written to console »).
# Cognito ne fermerait PAS ce trou : son envoi integre est plafonne et AWS
# renvoie vers SES des qu on veut son propre domaine. On aurait deux systemes
# au lieu d un. Et Cognito couterait cher sur les invariants : identite hors de
# Payload a resynchroniser avec `enchainement.auteur`, `access` a reecrire
# autour d un jeton externe, double connexion avec /admin, deuxieme plan de
# controle a operer (CM-1, le risque n 1 du projet).
# CONSEQUENCE DE SEQUENCE : seule 3-3 a besoin d un expediteur. 3-4, 3-1, 3-2 et
# 3-5 n'en ont pas besoin, a condition de ne pas activer la verification
# d'adresse a l'inscription. Le choix SES / Resend est donc REPORTE a 3-3, et il
# est reversible (meme SMTP derriere @payloadcms/email-nodemailer).
#
# LIVRE :
#   - champ `admin` (case a cocher) sur users, avec un acces de CHAMP qui refuse
#     la valeur a quiconque n'est pas deja admin. C'est ce qui interdit
#     l'auto-promotion, y compris via l'API REST/GraphQL et y compris glissee
#     dans le corps d'une future inscription (3-1) ;
#   - ecriture de Danse / Position / Passe / Media reservee au drapeau, via le
#     predicat partage `adminSeul` (src/collections/acces.ts). Un seul endroit,
#     pour que « admin » veuille dire la meme chose partout (ADD-5 / AD-3) ;
#   - MEDIA EST INCLUS deliberement : laisser le televersement ouvert rendrait le
#     verrou des positions decoratif. On ne pourrait pas modifier la position,
#     mais on pourrait remplacer l'image qu'elle affiche ;
#   - amorcage par ADMIN_EMAIL (semis au demarrage, cf. src/seed.ts). Il PROMEUT
#     un compte existant, il n'en cree pas : pas de mot de passe dans une
#     variable, et cela fonctionne en prod ou le compte existe deja. Sans
#     administrateur, le demarrage AVERTIT dans les logs (un catalogue en
#     lecture seule est un etat voulu, mais il doit etre lisible) ;
#   - migration 20260830_202812_drapeau_admin (une colonne, ALTER TABLE) ;
#   - variable propagee jusqu a la prod (docker-compose + secret GitHub) et
#     procedure ecrite dans docs/mise-en-production.md (« Devenir
#     administrateur »).
#   7 tests d integration ajoutes (49 verts), 17 e2e verts, build de prod OK.
#
# NON FAIT, VOLONTAIREMENT :
#   - /admin reste ouvert a tout compte connecte. Le fermer aux seuls admins
#     serait coherent, mais /admin est AUJOURD HUI la seule porte de connexion
#     du site (le compositeur y renvoie) : la fermer maintenant priverait les
#     eleves de tout moyen de se connecter. A trancher AVEC 3-2, quand une page
#     de connexion publique existera.
#   - la collection users garde les acces par defaut de Payload sur create et
#     update. A reprendre avec 3-1 (inscription ouverte) et 3-2 (un compte ne
#     doit pouvoir modifier QUE le sien).
#
# DANGER RELEVE EN PASSANT, A TRAITER AVANT 3-1 :
#   Enchainement.update / delete acceptent encore TOUT compte connecte. Le TODO
#   portait « Story 3.4 » alors que la regle appartient a 4-5 ; il est retague et
#   son commentaire dit desormais explicitement le risque. Inoffensif tant que
#   personne ne peut se connecter, mais le jour ou 3-1 livre l inscription, le
#   premier inscrit peut reecrire le travail des autres eleves. 3-1 NE DOIT PAS
#   PARTIR SANS CETTE REGLE.
#
# EFFET DE BORD ASSUME : la collection users prend des libelles francais
# (« Utilisateurs »), comme toutes les autres (NFR-7). Le test e2e herite du
# scaffold attendait « Users » : assertion corrigee, c'est le libelle qui a
# raison.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CONVENTION DE STATUT — QUAND UNE STORY PASSE `done` (decision Alain, 2026-08-30)
# ---------------------------------------------------------------------------
# Constat : 22 stories sont en `review` et AUCUNE en `done`. Ce n'est pas un
# oubli de suivi.
#
# Decision : une story ne passe `done` qu'apres confrontation a de VRAIS
# UTILISATEURS — les eleves d'Alain — ce qui joue ici le role de la demo de fin
# de sprint. `review` signifie donc « livre, en production, mais pas encore
# valide par l'usage ». Tant que personne d'autre qu'Alain n'a utilise le site,
# rien ne bascule.
#
# Consequence a garder en tete : le taux de `done` ne mesure PAS l'avancement du
# code. Pour savoir ou en est le produit, lire `review` comme « fait ». La
# bascule en masse se fera en une fois, apres les premiers retours d'eleves.
# Rappel : c'est aussi le critere de succes v1 du brief — « Alain et ses propres
# eleves utilisent reellement l'appli ». La convention de statut colle donc a la
# definition de succes du produit, elle ne s'y ajoute pas.
# ---------------------------------------------------------------------------

