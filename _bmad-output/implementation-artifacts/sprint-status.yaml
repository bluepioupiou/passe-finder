# AUCUNE RUPTURE N'EST COMPOSABLE, comme demande a cette date : le rail ne
# propose que les passes qui partent de la position courante.
# [MIS A JOUR le 2026-09-01 par la Story 4.7] Les ruptures sont desormais
# composables, mais JAMAIS LIBREMENT : seules les transitions declarees sont
