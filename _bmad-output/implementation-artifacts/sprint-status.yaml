# action serveur d'enregistrement.
# Voir 4-1-4-2-4-3-tranche-creation-enchainement.md.
#
# LA PORTE EST COTE SERVEUR. L'absence du « + » n'est qu'un confort d'affichage :
# la page ET l'action verifient la session, independamment l'une de l'autre, et
# l'ecriture passe par les `access` de la collection (`overrideAccess: false`).
