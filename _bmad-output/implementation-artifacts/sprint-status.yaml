# STORY 3-4 : ROLE ADMIN & GOUVERNANCE DU CATALOGUE (2026-08-30)
# ---------------------------------------------------------------------------
# Premiere story de l'Epic 3. Choisie en tete parce qu'elle est le prerequis de
# 3-1 : sans le drapeau, tout inscrit pourrait editer le catalogue.
#
# QUESTION POSEE PAR ALAIN AVANT DE LANCER : « pas un service AWS simple pour
# eviter de gerer creation de comptes, envoi de mail, mot de passe oublie ? »
# Reponse retenue, qui CONFIRME AD-9 apres examen (la decision a ete rouverte,
# pas subie) : la question melangeait deux choses.
#   - L'AUTHENTIFICATION est deja acquise et gratuite : `auth: true` sur la
#     collection users fournit comptes, sessions, hachage, et les operations
#     forgot-password / reset-password. Il ne reste qu a poser des ecrans.
#   - L'ACHEMINEMENT DU MAIL est le seul vrai trou : Payload fabrique le
#     message mais ne le livre pas (au demarrage : « No email adapter
#     provided. Email will be written to console »).
# Cognito ne fermerait PAS ce trou : son envoi integre est plafonne et AWS
# renvoie vers SES des qu on veut son propre domaine. On aurait deux systemes
# au lieu d un. Et Cognito couterait cher sur les invariants : identite hors de
# Payload a resynchroniser avec `enchainement.auteur`, `access` a reecrire
# autour d un jeton externe, double connexion avec /admin, deuxieme plan de
# controle a operer (CM-1, le risque n 1 du projet).
# CONSEQUENCE DE SEQUENCE : seule 3-3 a besoin d un expediteur. 3-4, 3-1, 3-2 et
# 3-5 n'en ont pas besoin, a condition de ne pas activer la verification
# d'adresse a l'inscription. Le choix SES / Resend est donc REPORTE a 3-3, et il
# est reversible (meme SMTP derriere @payloadcms/email-nodemailer).
#
# LIVRE :
#   - champ `admin` (case a cocher) sur users, avec un acces de CHAMP qui refuse
#     la valeur a quiconque n'est pas deja admin. C'est ce qui interdit
#     l'auto-promotion, y compris via l'API REST/GraphQL et y compris glissee
#     dans le corps d'une future inscription (3-1) ;
#   - ecriture de Danse / Position / Passe / Media reservee au drapeau, via le
#     predicat partage `adminSeul` (src/collections/acces.ts). Un seul endroit,
#     pour que « admin » veuille dire la meme chose partout (ADD-5 / AD-3) ;
#   - MEDIA EST INCLUS deliberement : laisser le televersement ouvert rendrait le
#     verrou des positions decoratif. On ne pourrait pas modifier la position,
#     mais on pourrait remplacer l'image qu'elle affiche ;
#   - amorcage par un SCRIPT LANCE A LA MAIN, une fois :
#       docker compose exec app npm run promouvoir:admin -- email@exemple.fr
#     Il promeut un compte existant, il n'en cree pas (pas de mot de passe dans
#     une variable). Sans argument, il reconnait le cas « un seul compte » mais
#     REFUSE DE DEVINER s il y en a plusieurs. Idempotent. Sans administrateur,
#     le demarrage AVERTIT dans les logs (un catalogue en lecture seule est un
#     etat voulu, mais il doit etre lisible) ;
#   - migration 20260830_202812_drapeau_admin (une colonne, ALTER TABLE) ;
#   - procedure ecrite dans docs/mise-en-production.md (« Devenir
#     administrateur »).
#
# CHOIX DU MECANISME D AMORCAGE (revu avec Alain le 2026-08-30, apres coup).
# La premiere version passait par une variable ADMIN_EMAIL lue au demarrage.
# Alain a propose a la place une MIGRATION promouvant « le compte au premier
# ID, puisqu en general il n y en a qu un ». Sa critique de la variable etait
# fondee (secret CI + redeploiement pour un geste unique, et du travail a
# chaque boot), mais la migration a deux defauts redhibitoires :
#   1. les migrations tournent AVANT le demarrage du serveur
#      (docker-entrypoint.sh) : sur une instance neuve la table users est VIDE.
#      La migration ne trouverait personne, ne ferait rien, et Payload
#      l enregistrerait quand meme comme appliquee — donc plus JAMAIS
#      d administrateur possible. C'est exactement le defaut tout-ou-rien de
#      l ancien import conditionnel du catalogue, deja rejete le 2026-08-30 ;
#   2. en developpement le schema est synchronise en `push` : les migrations
#      n y tournent pas, le poste local ne serait donc jamais promu.
# Retenu : le script a la main, meme forme et meme place que migrate:*, dont la
# reprise du catalogue a montre que la forme convenait. Le cas « un seul
# compte » que visait Alain est bien reconnu, mais par CONSTAT au moment du
# lancement, pas par pari sur un ID.
#   7 tests d integration ajoutes (49 verts), 17 e2e verts, build de prod OK.
#
# NON FAIT, VOLONTAIREMENT :
#   - /admin reste ouvert a tout compte connecte. Le fermer aux seuls admins
#     serait coherent, mais /admin est AUJOURD HUI la seule porte de connexion
#     du site (le compositeur y renvoie) : la fermer maintenant priverait les
#     eleves de tout moyen de se connecter. A trancher AVEC 3-2, quand une page
#     de connexion publique existera.
#   - la collection users garde les acces par defaut de Payload sur create et
#     update. A reprendre avec 3-1 (inscription ouverte) et 3-2 (un compte ne
#     doit pouvoir modifier QUE le sien).
#
# DANGER RELEVE EN PASSANT, A TRAITER AVANT 3-1 :
#   Enchainement.update / delete acceptent encore TOUT compte connecte. Le TODO
#   portait « Story 3.4 » alors que la regle appartient a 4-5 ; il est retague et
#   son commentaire dit desormais explicitement le risque. Inoffensif tant que
#   personne ne peut se connecter, mais le jour ou 3-1 livre l inscription, le
#   premier inscrit peut reecrire le travail des autres eleves. 3-1 NE DOIT PAS
#   PARTIR SANS CETTE REGLE.
#
# EFFET DE BORD ASSUME : la collection users prend des libelles francais
# (« Utilisateurs »), comme toutes les autres (NFR-7). Le test e2e herite du
# scaffold attendait « Users » : assertion corrigee, c'est le libelle qui a
