name: CI

# Modèle de branches :
#   - PULL REQUEST : qualité, construction de l'image et test de fumée.
#     Rien n'est publié ni déployé — on valide la fusion proposée.
#   - PUSH SUR `main` (donc une fusion) : en plus, publication de l'image sur
#     ghcr.io puis déploiement en production, si tout ce qui précède est vert.
#
# Une pull request est testée sur le RÉSULTAT DE LA FUSION, pas sur la branche
# isolée : on valide donc ce qui atterrira réellement dans `main`.
#
# Pousser une branche sans pull request ne déclenche rien : c'est voulu.
on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée sur la même branche annule l'exécution en cours :
# inutile de tester un état déjà dépassé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Qualité — rapide, échoue tôt. Sur chaque pull request et sur `main`.
  # ---------------------------------------------------------------------------
  qualite:
    name: Qualité (typage, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Les unitaires en premier : ils ne touchent a rien, durent quelques
      # secondes, et couvrent les trois quarts des cas. Echouer ici coute
      # beaucoup moins cher qu'echouer apres l'integration.
      - name: Tests unitaires
        run: npm run test:unit
        env:
          # Valeur factice : src/env.ts exige PAYLOAD_SECRET au chargement.
          # Ce n'est PAS un secret de production.
          PAYLOAD_SECRET: ci-unit-secret

      # Les tests d'integration parlent au vrai Payload et poussent le schema
      # dans une base dediee (.tmp/test.db), en SERIE : deux fichiers poussant
      # le schema en parallele dans le meme fichier SQLite se verrouillaient
      # mutuellement, ce qui rendait ce job rouge de facon systematique.
      # Voir l'en-tete de vitest.int.config.mts.
      - name: Tests d'intégration
        run: npm run test:int
        env:
          PAYLOAD_SECRET: ci-integration-secret

  # ---------------------------------------------------------------------------
  # 2) Image — construite UNE FOIS et testée à chaque pull request.
  #    Publiée uniquement lors d'une fusion dans `main`.
  # ---------------------------------------------------------------------------
  image:
    name: Image (build, fumée, publication)
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le nom de l'image
        id: image
        # Le nom d'une image ghcr.io doit être entièrement en minuscules.
        run: |
          name="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image (chargée localement)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrer le conteneur
        run: |
          docker run -d --name pf-ci -p 3000:3000 \
            -e PAYLOAD_SECRET=ci-smoke-secret \
            -v pf-ci-data:/data \
            "${{ steps.image.outputs.name }}:${{ github.sha }}"

      - name: Attendre que l'application réponde
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
              echo "Application prête après ${i}s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' pf-ci)" != "true" ]; then
              echo "Le conteneur s'est arrêté avant de répondre."
              docker logs pf-ci
              exit 1
            fi
            sleep 1
          done
          echo "L'application n'a pas répondu dans le délai imparti."
          docker logs pf-ci
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Test de fumée contre le conteneur
        run: npm run test:e2e -- tests/e2e/smoke.e2e.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Journaux du conteneur (diagnostic en cas d'échec)
        if: failure()
        run: docker logs pf-ci

      # --- Publication : depuis `main` uniquement ---------------------------
      - name: Connexion à ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton fourni automatiquement par GitHub : aucun secret à créer.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker push "${{ steps.image.outputs.name }}:latest"
          echo "Image publiée : ${{ steps.image.outputs.name }}:${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # 3) Déploiement — `main` uniquement, après une image publiée et testée.
  # ---------------------------------------------------------------------------
  deploiement:
    name: Déploiement en production
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Tant que le serveur n'est pas configuré, ce job ne doit pas faire
      # échouer le pipeline : il s'arrête proprement en l'annonçant.
      - name: Vérifier que le déploiement est configuré
        id: verif
        run: |
          if [ -z "${{ secrets.SSH_HOTE }}" ]; then
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Déploiement ignoré : les secrets ne sont pas renseignés (voir docs/mise-en-production.md)."
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer le nom de l'image
        if: steps.verif.outputs.pret == 'true'
        id: image
        run: |
          name="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Préparer la connexion SSH
        if: steps.verif.outputs.pret == 'true'
        run: |
          mkdir -p ~/.ssh
          # La clé privée vient des secrets : GitHub la masque dans les journaux.
          echo "${{ secrets.SSH_CLE_PRIVEE }}" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          # Empreinte du serveur, pour éviter toute question interactive.
          ssh-keyscan -H "${{ secrets.SSH_HOTE }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Envoyer les fichiers de déploiement
        if: steps.verif.outputs.pret == 'true'
        run: |
          # Le dossier peut ne pas exister au tout premier déploiement.
          ssh -i ~/.ssh/deploiement "${{ secrets.SSH_UTILISATEUR }}@${{ secrets.SSH_HOTE }}" \
            'sudo mkdir -p /opt/passe-finder && sudo chown $USER:$USER /opt/passe-finder'
          scp -i ~/.ssh/deploiement \
            deploy/docker-compose.yml deploy/Caddyfile deploy/litestream.yml deploy/bootstrap.sh \
            deploy/sauvegarde-medias.sh deploy/restaurer.sh \
            "${{ secrets.SSH_UTILISATEUR }}@${{ secrets.SSH_HOTE }}:/opt/passe-finder/"

      # Prépare la machine (Docker, swap, dossiers). Idempotent : sans effet si
      # tout est déjà en place. Évite tout geste manuel sur un serveur neuf.
      - name: Préparer le serveur
        if: steps.verif.outputs.pret == 'true'
        run: |
          ssh -i ~/.ssh/deploiement "${{ secrets.SSH_UTILISATEUR }}@${{ secrets.SSH_HOTE }}" \
            'sh /opt/passe-finder/bootstrap.sh'

      - name: Déployer
        if: steps.verif.outputs.pret == 'true'
        run: |
          # Le tag SHA est immuable : on déploie exactement l'image testée,
          # jamais un `latest` qui aurait pu bouger entre-temps.
          ssh -i ~/.ssh/deploiement \
            "${{ secrets.SSH_UTILISATEUR }}@${{ secrets.SSH_HOTE }}" \
            IMAGE="${{ steps.image.outputs.name }}:${{ github.sha }}" \
            PAYLOAD_SECRET="${{ secrets.PAYLOAD_SECRET }}" \
            DOMAINE="${{ secrets.DOMAINE }}" \
            AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            S3_BUCKET="${{ secrets.S3_BUCKET }}" \
            S3_REGION="${{ secrets.S3_REGION }}" \
            CLOUDFLARE_ANALYTICS_TOKEN="${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}" \
            "bash -s" <<'DISTANT'
          set -e
          cd /opt/passe-finder

          # Le fichier .env reste sur le serveur, accessible au seul propriétaire.
          umask 077
          cat > .env <<ENV
          IMAGE=$IMAGE
          PAYLOAD_SECRET=$PAYLOAD_SECRET
          DOMAINE=$DOMAINE
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          S3_BUCKET=$S3_BUCKET
          S3_REGION=$S3_REGION
          CLOUDFLARE_ANALYTICS_TOKEN=$CLOUDFLARE_ANALYTICS_TOKEN
          ENV

          echo "-> Récupération de l'image..."
          sudo docker compose pull

          # LITESTREAM EST ARRÊTÉ LE TEMPS DES MIGRATIONS, et ce n'est pas une
          # précaution de confort (incident du 2026-09-01).
          #
          # Litestream v0.5 ÉCRIT dans la base (table `_litestream_seq`) : le
          # laisser tourner pendant `payload migrate`, c'est DEUX écrivains sur
          # le même fichier SQLite. Une migration un peu longue se fait alors
          # couper au milieu — et une migration interrompue laisse un schéma à
          # moitié appliqué que Payload n'a pas enregistré. Au redémarrage
          # suivant elle repart de zéro, bute sur sa propre colonne, et
          # `set -e` arrête le conteneur. La production ne redémarre plus.
          #
          # `depends_on` ne suffisait pas : au redéploiement, seul `app` est
          # recréé (l'image a changé) et Litestream, lui, continue de tourner.
          #
          # `app` est arrêté avec lui, et ça ne coûte AUCUNE disponibilité de
          # plus : `up -d` recrée déjà le conteneur (l'image a changé), donc il
          # s'arrêtait de toute façon avant que le nouveau ne migre. Ça règle en
          # revanche le cas où l'ancien conteneur est en boucle de redémarrage :
          # il relance alors `payload migrate` toutes les quelques secondes, et
          # redevient le deuxième écrivain qu'on cherche à écarter.
          echo "-> Arrêt de l'application et de la réplication le temps des migrations..."
          sudo docker compose stop app litestream

          # Les migrations SEULES, dans un conteneur jetable : `--no-deps` pour
          # ne réveiller personne, `--entrypoint` pour ne pas démarrer Next.js
          # dans la foulée. Si elles échouent, `set -e` arrête le déploiement
          # ICI, avant d'avoir touché à quoi que ce soit d'autre.
          echo "-> Application des migrations, base pour nous seuls..."
          sudo docker compose run --rm --no-deps --entrypoint sh app -c 'npm run payload -- migrate'

          echo "-> Redémarrage des conteneurs..."
          sudo docker compose up -d --remove-orphans

          echo "-> Nettoyage des images devenues inutiles..."
          sudo docker image prune -f
          DISTANT

      - name: Vérifier que le site répond
        if: steps.verif.outputs.pret == 'true'
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.DOMAINE }}/" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Site en ligne (HTTP 200) après ${i} tentative(s)."
              exit 0
            fi
            sleep 10
          done
          echo "Le site n'a pas répondu 200 dans le délai imparti."
          exit 1
