# Pile de production Passe Finder.
# Deposee sur le serveur dans /opt/passe-finder par le job de deploiement.
#
# Trois conteneurs :
#   app        : l'application (migrations + WAL + Next.js au demarrage)
#   caddy      : HTTPS automatique (Let's Encrypt), unique porte d'entree publique
#   litestream : replication continue de la base vers S3
#
# Les variables viennent du fichier .env voisin, ecrit par le deploiement.

services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      DATABASE_URI: file:/data/passe-finder.db
    volumes:
      - donnees:/data
      - medias:/app/media
    # Volontairement PAS de ports publies : seul Caddy expose le service.
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAINE: ${DOMAINE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_donnees:/data
      - caddy_config:/config

  litestream:
    image: litestream/litestream:latest
    restart: unless-stopped
    # L'image tourne par defaut en `nonroot`, qui n'a que les droits « autres »
    # sur /data (possede par l'uid 1001 de l'app). Litestream v0.5 ECRIT dans la
    # base (table `_litestream_seq`) : sans cet alignement d'uid, il echoue sur
    # « attempt to write a readonly database » et ne replique rien.
    user: '1001:1001'
    depends_on:
      - app
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
    volumes:
      # Meme volume que l'app : Litestream lit le fichier de base en direct.
      - donnees:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate

volumes:
  donnees:
  medias:
  caddy_donnees:
  caddy_config:
