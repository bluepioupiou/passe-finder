# Pile de production Passe Finder.
# Deposee sur le serveur dans /opt/passe-finder par le job de deploiement.
#
# Quatre conteneurs :
#   app               : l'application (migrations + WAL + Next.js au demarrage)
#   caddy             : HTTPS automatique (Let's Encrypt), unique porte d'entree publique
#   litestream        : replication continue de la base vers S3
#   sauvegarde-medias : copie horaire des images televersees vers le meme bucket
#
# Les variables viennent du fichier .env voisin, ecrit par le deploiement.

services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      DATABASE_URI: file:/data/passe-finder.db
      # Mesure d'audience (story 1.7). Facultative : si le secret n'est pas
      # renseigne, la variable arrive vide et aucun script n'est emis. Elle est
      # fournie ICI, a l'execution, et non a la construction de l'image : le
      # jeton n'existe pas dans GitHub Actions au moment du build.
      CLOUDFLARE_ANALYTICS_TOKEN: ${CLOUDFLARE_ANALYTICS_TOKEN:-}
      # PAS de variable pour l administrateur (story 3.4) : le drapeau se pose
      # une fois, a la main, quand le compte existe :
      #   docker compose exec app npm run promouvoir:admin -- email@exemple.fr
    volumes:
      - donnees:/data
      - medias:/app/media
    # Volontairement PAS de ports publies : seul Caddy expose le service.
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAINE: ${DOMAINE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # La page de mise a jour, et le drapeau qui l'active. En LECTURE SEULE :
      # c'est le deploiement qui pose et retire le drapeau sur l'hote, jamais
      # Caddy. Le dossier doit exister meme vide, sinon Docker le cree en
      # root et le matcher `file` ne trouve rien.
      - ./maintenance:/srv/maintenance:ro
      - caddy_donnees:/data
      - caddy_config:/config

  litestream:
    image: litestream/litestream:latest
    restart: unless-stopped
    # L'image tourne par defaut en `nonroot`, qui n'a que les droits « autres »
    # sur /data (possede par l'uid 1001 de l'app). Litestream v0.5 ECRIT dans la
    # base (table `_litestream_seq`) : sans cet alignement d'uid, il echoue sur
    # « attempt to write a readonly database » et ne replique rien.
    user: '1001:1001'
    depends_on:
      - app
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
    volumes:
      # Meme volume que l'app : Litestream lit le fichier de base en direct.
      - donnees:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate

  # Sauvegarde des images televersees vers le meme bucket S3 que la base.
  # Litestream couvre /data (la base) ; ce conteneur couvre /app/media (les
  # images). Sans lui, perdre la machine = perdre les images ajoutees depuis
  # le back-office.
  #
  # rclone plutot que l'AWS CLI : un binaire Go de quelques Mo (~20 Mo de
  # memoire le temps de la copie) contre ~120 Mo pour la CLI Python. Sur une
  # instance a 1 Go partagee avec Next.js, la difference compte.
  sauvegarde-medias:
    image: rclone/rclone:1
    restart: unless-stopped
    # Meme uid que l'application : le volume des images lui appartient.
    user: '1001:1001'
    depends_on:
      - app
    environment:
      # Configuration rclone par variables : pas de fichier de conf a deployer.
      RCLONE_CONFIG: /tmp/rclone.conf
      HOME: /tmp
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: AWS
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      # Une copie par heure. La base, elle, est repliquee en secondes : une
      # image ajoutee dans l'heure precedant une panne serait a re-televerser.
      INTERVALLE_SAUVEGARDE: 3600
    volumes:
      # Monte en ecriture UNIQUEMENT pour permettre la restauration
      # (deploy/restaurer.sh reutilise ce conteneur dans l'autre sens).
      # La boucle de sauvegarde, elle, ne fait que lire.
      - medias:/medias
      - ./sauvegarde-medias.sh:/sauvegarde-medias.sh:ro
    entrypoint: ['/bin/sh', '/sauvegarde-medias.sh']

volumes:
  donnees:
  medias:
  caddy_donnees:
  caddy_config:
